  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>The Slate — Filmmaking<\u002Ftitle>\n<script data-design-copy=\"stand-in server, from tools/design-server.js\">\n// The design copy's stand-in for the Slate's server.\n//\n// tools/bundle.py design puts this at the top of the design copy, and only\n// there: the live Slate never has it. It answers the app's calls to\n// list.php, load.php, save.php, share.php, delete.php, trash.php,\n// comments.php, onset.php, gif.php and still.php the way the server does, from sample people,\n// storyboards and comments kept in this browser. So the Team Library,\n// Share, comments, the Trash and the top bar all work with nothing\n// connected, by the server's own rules for who may see, edit, comment on and\n// share what.\n//\n// You are Craig Groeschel, an ordinary member of the team (not an admin). GIF\n// search finds nothing: GIFs come from GIPHY, which needs the server. Nor\n// can a still be dragged in from ShotDeck, which needs it too; pasting works.\n//\n// slateDesignReset() in the browser's console starts again from the sample\n// data, clearing everything this file has kept. A new version of the sample\n// data does the same by itself the first time it's opened.\n(function () {\n  'use strict';\n\n  var DB_NAME = 'slate-design-server';\n  var MAX_BYTES = 33554432;\n  var TRASH_DAYS = 30;\n  var LEVELS = ['view', 'comment', 'edit'];\n  var ID_RE = /^[a-z0-9](?:[a-z0-9-]{0,51}[a-z0-9])?-[0-9a-f]{6}$/;\n  var DAY = 86400000, HOUR = 3600000;\n\n  // ---- Storage: one IndexedDB store, apart from the app's own ------------\n\n  var dbOpen = null;\n  function db() {\n    if (!dbOpen) {\n      dbOpen = new Promise(function (resolve, reject) {\n        var req = indexedDB.open(DB_NAME, 1);\n        req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };\n        req.onsuccess = function () { resolve(req.result); };\n        req.onerror = function () { reject(req.error); };\n      });\n    }\n    return dbOpen;\n  }\n  function store(mode, work) {\n    return db().then(function (d) {\n      return new Promise(function (resolve, reject) {\n        var tx = d.transaction('kv', mode);\n        var req = work(tx.objectStore('kv'));\n        tx.oncomplete = function () { resolve(req && req.result); };\n        tx.onerror = function () { reject(tx.error); };\n      });\n    });\n  }\n  function get(key) { return store('readonly', function (s) { return s.get(key); }); }\n  function put(key, value) { return store('readwrite', function (s) { return s.put(value, key); }); }\n  function drop(key) { return store('readwrite', function (s) { return s.delete(key); }); }\n\n  var seeded = null;\n  async function loadState() {\n    if (!seeded) seeded = get('state').then(function (s) { return s || seed(); });\n    await seeded;\n    return get('state');\n  }\n  function saveState(state) { return put('state', state); }\n\n  // ---- The server's rules (lib.php) ------------------------------------\n\n  function rank(level) { return LEVELS.indexOf(level); }\n  function visibility(meta) { return meta && meta.visibility === 'private' ? 'private' : 'team'; }\n  function owner(meta) { return String((meta && (meta.owner || meta.savedByUser)) || '').trim(); }\n  function owns(meta, user) { var o = owner(meta); return o !== '' && o.toLowerCase() === user.username.toLowerCase(); }\n  function teamLevel(meta) { return rank(meta && meta.teamLevel) >= 0 ? meta.teamLevel : 'edit'; }\n  // Shares and requests are kept as [id, ...] pairs, in the order given, as\n  // the server's JSON objects keep them.\n  function sharesOf(meta) { return (meta && meta.shares) || []; }\n  function requestsOf(meta) { return (meta && meta.requests) || []; }\n  function shareOf(meta, id) { var p = sharesOf(meta).find(function (s) { return s[0] === id; }); return p ? p[1] : ''; }\n  function access(meta, user) {\n    if (owns(meta, user)) rs. [width]\n     keeps it to the icons, not the symbols' own copies. */\n  svg[width]{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n  body{background:var(--gray-5);font-family:var(--font-body);-webkit-font-smoothing:antialiased}\n  input,textarea,button,select{font-family:inherit;color:inherit}\n  textarea{outline:none}\n  input{outline:none}\n  input:focus,textarea:focus{border-color:var(--black)!important}\n  ::placeholder{color:var(--gray-20);font-weight:400}\n  ::-webkit-scrollbar{height:10px;width:10px}\n  ::-webkit-scrollbar-thumb{background:var(--gray-20);border-radius:0}\n  ::-webkit-scrollbar-track{background:transparent}\n  @keyframes cgpop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n  .cg-card{animation:cgpop .18s ease both}\n  /* Touch screens have no hover, so the image buttons (zoom, aspect,\n     replace, remove), which appear on hover, are shown all the time. */\n  @media (hover:none){\n    .sl-imgtools{opacity:1!important;pointer-events:auto!important}\n  }\n  /* View only (shared to look at, not change): the board can be read,\n     printed and exported, and nothing on it reacts. The fields are also\n     made read-only in componentDidUpdate, so Tab can't reach them either. */\n  .cg-board-wrap[data-access=\"view\"] .sl-edit-only,\n  .cg-board-wrap[data-access=\"view\"] .sl-cardfoot > :not(.sl-comment-btn),\n  .cg-board-wrap[data-access=\"view\"] .sl-cardfoot::before,\n  .cg-board-wrap[data-access=\"view\"] .sl-imgtools{display:none!important}\n  .cg-board-wrap[data-access=\"view\"] .sl-cardfoot:not(:has(.sl-comment-btn[data-show=\"1\"])){display:none!important}\n  .cg-board-wrap[data-access=\"view\"] .cg-board,\n  .cg-board-wrap[data-access=\"view\"] .sl-board-head input{pointer-events:none}\n  /* Commenting is the one thing a comment-only board still reacts to. */\n  .cg-board-wrap[data-access=\"view\"] .sl-comment-btn{pointer-events:auto}\n  /* The comments drawer sits beside the board; on a phone it covers it. */\n  @media screen and (max-width:640px){\n    .sl-comments{width:100%!important;border-left:none!important}\n  }\n  @media print{ .sl-comments{display:none!important} }\n  /* Wide enough, the board makes room rather than hide under it. */\n  @media screen and (min-width:1000px){\n    .cg-board-wrap[data-comments=\"open\"]{margin-right:380px}\n  }\n  /* Share panel: full screen on a phone. */\n  @media screen and (max-width:640px){\n    .sl-share-card{width:100%!important;max-width:none!important;min-height:100vh;border:none!important}\n    .sl-share-wrap{padding:0!important;align-items:stretch!important}\n    .sl-request-card{min-height:0!important;border-bottom:1px solid var(--gray-15)!important}\n  }\n  /* Reorder buttons: for touch screens and narrow windows, where carrying a\n     card the length of the board is hard going. Everywhere, the handle\n     drags (onHandlePointerDown). */\n  .sl-move{display:none!important}\n  @media (hover:none), (max-width:640px){\n    .sl-move{display:flex!important}\n  }\n  /* A finger on the handle carries the card rather than scroll the page. */\n  [data-grip]{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n  /* While a card is carried nothing gets selected, and the window doesn't\n     scroll to keep its place as the others make way (scroll anchoring). */\n  html.sl-dragging, html.sl-dragging body{overflow-anchor:none}\n  html.sl-dragging, html.sl-dragging *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}\n  /* What is carried stays where it was, faded, in a dashed outline. Its\n     contents fade rather than the card, so the outline stays sharp; and\n     !important, as a card's pop-in animation keeps hold of its opacity. */\n  .sl-drag-ghost{outline:2px dashed var(--sl-accent)!important;outline-offset:-2px!important;background:transparent!important}\n  .sl-drag-ghost > *{opacity:.35!important}\n  .sl-marker.sl-drag-ghost{background:var(--gray-20)!important}\n  /* Its new place, empty until the copy lands in it. */\n  .sl-drag-landing{visibility:hidden!important}\n  .sl-drag-float, .sl-drag-float *{pointer-events:none!important}\n\n  /* The bar across the top of the storyboard list: the filmmaking tools'\n     shared nav, as fm_nav() in filmmaking-home's auth/page.php draws it on\n     the other tools, with its styles from auth/nav.css under .sl-nav rather\n     than .fmnav. Under its own name so whichever nav.css index.php links,\n     older or newer, never restyles it halfway; .fm-photo is still nav.css's.\n     Dark in both themes. Wide, the wordmark, the tools in mono caps with the\n     Slate outlined, and who's signed in as their photo, which opens their\n     links. At 960px and under, the wordmark and one button, which opens a\n     panel of the tools, with their blurbs, and the account links. Both\n     menus are popovers: they open, close on Esc or a click outside and work\n     from the keyboard with no script. The Slate's own light/dark switch is\n     a row in each menu (in the bar itself when signed out). Colours and\n     fonts are brand.css's --bar-* and --font-* variables, with nav.css's\n     fallbacks. */\n  .sl-nav{\n    --fm-bg:var(--bar-bg,#1F2023); --fm-solid:var(--bar-bg,#1F2023);\n    --fm-border:var(--bar-rule,#2E2F33); --fm-line:var(--bar-line,#3A3B40);\n    --fm-line-hover:var(--bar-line-hover,#5A5B61);\n    --fm-link:var(--bar-text,#C9CACE); --fm-link-2:var(--bar-text-2,#A9AAAE);\n    --fm-dim:var(--bar-dim,#8B8C90); --fm-link-hover:#FFFFFF;\n    --fm-wordmark:var(--bar-strong,#F2F2F2); --fm-accent:var(--accent,#56C4E5);\n    --fm-raised:var(--bar-raised,#2A2B2F); --fm-raised-hover:#34353A;\n    --fm-display:var(--font-display,\"Helvetica Neue\",Helvetica,Arial,sans-serif);\n    --fm-body:var(--font-body,\"Helvetica Neue\",Helvetica,Arial,sans-serif);\n    --fm-mono:var(--font-mono,ui-monospace,Menlo,monospace);\n    --fm-h:56px; --fm-pad:0 20px 0 26px;\n    position:sticky; top:0; z-index:50;\n    display:flex; align-items:center; gap:4px;\n    height:var(--fm-h); padding:var(--fm-pad); margin:0;\n    background:var(--fm-bg); border-bottom:1px solid var(--fm-border);\n    box-sizing:border-box; -webkit-font-smoothing:antialiased;\n  }\n  .sl-nav a:focus-visible, .sl-nav button:focus-visible{outline:2px solid var(--fm-accent);outline-offset:2px}\n  .sl-nav a.home{\n    flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; margin-right:28px;\n    font-family:var(--fm-display); font-size:20px; font-weight:900; line-height:normal;\n    letter-spacing:0.14em; text-transform:uppercase; white-space:nowrap;\n    text-decoration:none; color:var(--fm-wordmark);\n  }\n  .sl-nav .fm-tools{display:flex;align-items:center;gap:4px}\n  .sl-nav .fm-tools a{\n    display:inline-flex; align-items:center; box-sizing:border-box; height:30px; padding:0 10px;\n    font-family:var(--fm-mono); font-size:11px; font-weight:400; letter-spacing:0.08em;\n    text-transform:uppercase; white-space:nowrap; text-decoration:none; color:var(--fm-link); line-height:1;\n    border:1px solid transparent; transition:color .16s ease,border-color .16s ease;\n  }\n  .sl-nav .fm-tools a:hover{color:var(--fm-link-hover)}\n  .sl-nav .fm-tools a.here{color:var(--fm-accent);border-color:var(--fm-accent)}\n  .sl-nav .spacer{margin-left:auto}\n  .sl-nav .fm-signin{\n    padding:0 4px; font-family:var(--fm-mono); font-size:11px; letter-spacing:0.08em;\n    text-transform:uppercase; text-decoration:none; color:var(--fm-link-2);\n  }\n  .sl-nav .fm-signin:hover{color:var(--fm-link-hover)}\n  /* Signed out, the light/dark switch has no menu to sit in, so it is here. */\n  .sl-nav .sl-nav-theme{\n    display:inline-flex; align-items:center; justify-content:center; flex:none;\n    width:30px; height:30px; margin:0 6px 0 0; padding:0; border-radius:50%;\n    background:transparent; border:1px solid var(--fm-line); color:var(--fm-link); cursor:pointer;\n  }\n  .sl-nav .sl-nav-theme:hover{color:var(--fm-link-hover);border-color:var(--fm-line-hover)}\n  .sl-nav .fm-me, .sl-nav .fm-burger{\n    display:inline-flex; align-items:center; gap:8px; box-sizing:border-box;\n    height:40px; padding:0 8px 0 6px; margin:0; font:inherit; color:var(--fm-link-2);\n    background:transparent; border:1px solid transparent; border-radius:0; cursor:pointer;\n    transition:color .16s ease,border-color .16s ease,background .16s ease;\n  }\n  .sl-nav .fm-me:hover{color:var(--fm-link-hover);border-color:var(--fm-line)}\n  .sl-nav .fm-chevron{stroke-width:3;transition:transform .16s ease}\n  .sl-nav:has(#fm-account:popover-open) .fm-me{color:var(--fm-link-hover);background:var(--fm-raised);border-color:var(--fm-line)}\n  .sl-nav:has(#fm-account:popover-open) .fm-chevron{transform:rotate(180deg)}\n  .sl-nav .fm-burger{display:none;gap:10px;height:44px;padding:0 10px 0 8px;color:var(--fm-wordmark);border-color:var(--fm-line)}\n  .sl-nav .fm-burger svg{stroke-width:1.9}\n  .sl-nav .fm-close-icon{display:none}\n  .sl-nav:has(#fm-menu:popover-open) .fm-burger{background:var(--fm-raised);border-color:var(--fm-line-hover)}\n  .sl-nav:has(#fm-menu:popover-open) .fm-burger-icon{display:none}\n  .sl-nav:has(#fm-menu:popover-open) .fm-close-icon{display:block}\n  .sl-nav .fm-pop{\n    position:fixed; inset:auto; margin:0; padding:6px 0; box-sizing:border-box; overflow:visible;\n    color:var(--fm-link); background:var(--fm-raised); border:1px solid var(--fm-line);\n    box-shadow:0 12px 32px rgba(0,0,0,0.35); -webkit-font-smoothing:antialiased;\n  }\n  .sl-nav .fm-pop::backdrop{background:transparent}\n  .sl-nav .fm-pop a, .sl-nav .fm-pop button{\n    display:flex; align-items:center; justify-content:flex-start; gap:10px; box-sizing:border-box;\n    width:100%; height:auto; min-height:40px; padding:0 16px; margin:0;\n    font-family:var(--fm-mono); font-size:11px; font-weight:400; letter-spacing:0.08em;\n    text-transform:uppercase; text-align:left; text-decoration:none; color:var(--fm-link); line-height:1.2;\n    background:transparent; border:0; border-radius:0; cursor:pointer;\n  }\n  .sl-nav .fm-pop a:hover, .sl-nav .fm-pop button:hover{color:var(--fm-link-hover);background:var(--fm-raised-hover)}\n  .sl-nav .fm-pop form{display:block;margin:6px 0 0;padding:6px 0 0;border-top:1px solid var(--fm-line)}\n  .sl-nav .fm-who{display:flex;align-items:center;gap:12px;padding:10px 16px 14px;margin-bottom:6px;border-bottom:1px solid var(--fm-line)}\n  .sl-nav .fm-name{display:flex;flex-direction:column;gap:4px;min-width:0}\n  .sl-nav .fm-name strong{font-family:var(--fm-body);font-size:14px;font-weight:700;color:var(--fm-wordmark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .sl-nav .fm-name > span{font-family:var(--fm-mono);font-size:11px;color:var(--fm-link-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .sl-nav .fm-account{display:none;top:calc(var(--fm-h) + 4px);right:20px;width:260px}\n  .sl-nav .fm-account:popover-open{display:flex;flex-direction:column}\n  .sl-nav .fm-menu{\n    display:none; top:var(--fm-h); left:0; right:0; width:auto;\n    max-height:calc(100dvh - var(--fm-h)); overflow-y:auto; padding:0 0 16px;\n    background:var(--fm-solid); border:0; border-bottom:1px solid var(--fm-border);\n    box-shadow:0 100vh 0 100vh rgba(0,0,0,0.55);\n  }\n  .sl-nav .fm-menu a:hover, .sl-nav .fm-menu button:hover{background:var(--fm-raised)}\n  .sl-nav .fm-sect{margin:0;padding:16px 16px 6px;font-family:var(--fm-mono);font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fm-dim)}\n  .sl-nav .fm-menu .fm-tool{justify-content:space-between;gap:12px;min-height:60px;padding:10px 16px;color:var(--fm-wordmark)}\n  .sl-nav .fm-tool > span:first-child{display:flex;flex-direction:column;gap:5px}\n  .sl-nav .fm-label{font-size:13px}\n  .sl-nav .fm-blurb{font-family:var(--fm-body);font-size:13px;letter-spacing:0;text-transform:none;color:var(--fm-link-2)}\n  .sl-nav .fm-tool.here .fm-label{color:var(--fm-accent)}\n  .sl-nav .fm-tag{flex:none;padding:4px 6px;font-size:10px;letter-spacing:0.1em;color:var(--fm-accent);border:1px solid var(--fm-accent)}\n  .sl-nav .fm-menu-account{margin-top:10px;padding-top:6px;border-top:1px solid var(--fm-border)}\n  /* Signed out, before the server has said which tools there are. */\n  .sl-nav .fm-menu > .fm-menu-account:first-child{margin-top:0;border-top:0}\n  .sl-nav .fm-menu .fm-who{padding:12px 16px 8px;margin:0;border-bottom:0}\n  .sl-nav .fm-menu .fm-name strong{font-size:15px}\n  .sl-nav .fm-menu-account a, .sl-nav .fm-menu-account .sl-nav-theme-row{min-height:48px;font-size:12px}\n  .sl-nav .fm-menu-account form{margin:0;padding:8px 16px 0;border-top:0}\n  .sl-nav .fm-menu-account form button{\n    justify-content:center; min-height:44px; font-family:var(--fm-display); font-weight:700; font-size:12px;\n    color:#ECECEC; background:var(--fm-raised); border:1px solid var(--fm-line);\n  }\n  .sl-nav .fm-menu-account form button:hover{background:var(--fm-raised-hover)}\n  .sl-nav .sl-nav-theme-row svg{flex:none;stroke-width:2}\n  @media screen and (max-width:960px){\n    .sl-nav{--fm-pad:0 6px 0 14px}\n    .sl-nav a.home{margin-right:12px;font-size:17px}\n    .sl-nav .fm-tools, .sl-nav .fm-me, .sl-nav .fm-signin, .sl-nav .sl-nav-theme{display:none}\n    .sl-nav .fm-burger{display:inline-flex}\n    .sl-nav .fm-account:popover-open{display:none}\n    .sl-nav .fm-menu:popover-open{display:block}\n    .sl-nav .fm-menu .fm-name strong{white-space:normal}\n  }\n\n  /* Phones. The layout is built from inline styles, so these override them\n     by class (hence !important). Nothing here changes print or PDF. */\n  @media screen and (max-width:640px){\n    .sl-menu-inner{padding:24px 16px 40px!important}\n    .sl-h1{font-size:30px!important}\n\n    /* Storyboard header: smaller title, colour key and fields full width. */\n    .sl-board-head{padding:16px 16px 18px!important}\n    .sl-title-box{min-width:0!important;flex:1 1 100%!important}\n    .sl-title-input{font-size:28px!important;width:100%!important}\n    .sl-colorkey{min-width:0!important;flex:1 1 100%!important;padding:0!important}\n    .sl-colorkey input{width:100%!important;min-width:0!important}\n    .sl-keygrid{grid-template-columns:1fr 1fr!important}\n    .sl-meta{gap:14px 18px!important}\n    .sl-meta label{flex:1 1 140px;min-width:0!important}\n    .sl-meta input{width:100%!important}\n\n    /* The toolbar keeps the count, the layouts and Share; the rest is in\n       the bar along the bottom (sl-phonebar). It scrolls away rather than\n       stay pinned to the top, where a wrapped row would cover the cards. */\n    .sl-toolbar{position:static!important;padding:12px 16px!important}\n    .sl-toolbar > div, .sl-toolbar > div > div{gap:8px!important}\n    .sl-toolbar button{padding-left:10px!important;padding-right:10px!important}\n    .sl-tb-phonehide{display:none!important}\n\n    /* The bar along the bottom: Add shot, On set, Comments, More. Its\n       room is kept clear at the end of the board. It steps aside while a\n       field is being typed in, as the keyboard would carry it up over it. */\n    .sl-phonebar{display:flex!important;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--white);border-top:1px solid var(--gray-15);box-shadow:0 -2px 12px rgba(0,0,0,0.08);padding:0 4px env(safe-area-inset-bottom)}\n    .sl-phonebar > button{flex:1 1 0;min-width:0;height:60px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0 2px;background:transparent;border:none;color:var(--gray-50);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}\n    .sl-phonebar > button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}\n    .sl-phonebar > button:active{background:var(--gray-5)}\n    .sl-phonebar .sl-phonebar-add{color:var(--cglp-blue)}\n    .sl-phonebar .sl-phonebar-add svg{stroke-width:3}\n    .sl-phonebar b{position:absolute;top:6px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--cglp-blue);color:#fff;font-family:var(--font-mono);font-size:10px;line-height:18px;letter-spacing:0;text-align:center}\n    html:has(:is(input:not([type=range]):not([type=file]), textarea, select):focus) .sl-phonebar{display:none!important}\n    .sl-main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))!important}\n    /* More, the sheet from the bottom: one row a finger wide for each. */\n    .sl-sheet-item{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 4px;background:transparent;border:none;border-bottom:1px solid var(--gray-10);color:var(--black);font-size:15px;font-weight:600;text-align:left;cursor:pointer}\n    .sl-sheet-item:last-child{border-bottom:none}\n    .sl-sheet-item svg{color:var(--gray-40);flex:0 0 auto}\n    .sl-sheet-chip{display:flex;align-items:center;height:40px;padding:0 12px;background:var(--white);border:1px solid var(--gray-15);color:var(--black);font-size:14px;font-weight:600;cursor:pointer}\n    .sl-sheet-chip[data-on=\"1\"]{border-color:var(--cglp-blue);color:var(--cglp-blue)}\n\n    /* Under 16px, an iPhone zooms the page in on any field that's tapped,\n       and leaves it zoomed. The big ones (title, scene, shot) keep theirs. */\n    input:not([type]):not(.sl-big):not(.sl-title-input), input[type=text]:not(.sl-big):not(.sl-title-input),\n    input[type=search], textarea, select{font-size:16px!important}\n\n    /* From ShotDeck / FrameSet: Cancel and Add side by side, full width. */\n    .sl-sd-foot > span{flex:1 1 100%!important}\n    .sl-sd-foot > button{flex:1 1 0;justify-content:center;text-align:center}\n\n    /* Grid card: subject and location share a line, time of day gets one. */\n    .sl-subjrow{flex-wrap:wrap}\n    .sl-subjrow > div{flex:1 1 140px!important;min-width:0!important}\n    /* Scene and shot need only a number's width, which leaves shot type\n       room for its name. */\n    .sl-numbox{width:40px!important;flex:0 0 40px!important}\n    /* Grid: one card per row, whatever the grid size (5, 4 or 3 across is\n       for wider screens), so the Size buttons have nothing to do. A schedule\n       marker is a bar across, as in the other layouts, not a column. */\n    .cg-board[data-layout=\"grid\"] > .cg-card{flex:1 1 100%!important;max-width:100%!important}\n    .sl-gridsize{display:none!important}\n    .cg-board[data-layout=\"grid\"] > .sl-marker{flex:1 1 100%!important;flex-direction:row!important;padding:8px 12px!important}\n    .cg-board[data-layout=\"grid\"] > .sl-marker .sl-marker-label{writing-mode:horizontal-tb!important;width:auto!important;text-align:left!important}\n    /* Strip: its row of fields wraps two to a line, and the shot's buttons\n       get a line of their own, as on the other cards. */\n    .sl-striprow{gap:10px 14px!important}\n    .sl-striprow > *{flex:1 1 120px!important;min-width:0!important}\n    .sl-striprow > .sl-stripfoot{flex:1 1 100%!important;margin:0!important;padding-top:10px!important;border-top:1px solid var(--gray-10)}\n    .sl-stripfoot::before{content:none!important}\n    /* List: the picture goes above the fields rather than beside them. */\n    .sl-imgwrap{width:100%!important;flex:1 1 100%!important;border-right:none!important}\n    .sl-fields{min-width:0!important}\n    /* AV (the filmstrip layout, once called Strip): its one long row of\n       fields wraps, and camera move gets a line. */\n    .sl-fieldrow{flex-wrap:wrap}\n    .sl-caminline{flex:1 1 100%!important}\n    .sl-descdlg{flex-direction:column!important}\n    /* Two tidy rows: move and add/duplicate/delete on top, then the drag\n       handle and the colour dots. Full size whatever the grid size: the\n       footer is only scaled down to fit small grid cards. */\n    .sl-cardfoot{flex-wrap:wrap;row-gap:0!important;transform:none!important;width:100%!important;max-width:100%!important}\n    .sl-cardfoot .sl-move{order:1}\n    .sl-cardfoot .sl-act{order:2}\n    .sl-cardfoot .sl-act-first{margin-left:auto}\n    .sl-cardfoot::before{content:\"\";order:3;flex-basis:100%;height:10px}\n    .sl-cardfoot .sl-handle{order:4}\n    .sl-cardfoot .sl-tags{order:5}\n  }\n\n  @media print{\n    [data-noprint]{display:none!important}\n    /* An empty field prints empty, not with its \"Add project\" hint — except\n       where the hint is the real value (colour names, scene 1). */\n    :not([data-print-hint])::placeholder{color:transparent!important}\n    body{background:#fff}\n    .cg-board{overflow:visible!important}\n    .cg-card{break-inside:avoid;page-break-inside:avoid}\n    /* A schedule marker stays a dark bar with light type on paper. The page\n       runtime already prints every background (print-color-adjust: exact);\n       said again here because a marker is where losing it would matter most:\n       its label would be white on white. */\n    .sl-marker{break-inside:avoid;page-break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  }\n<\u002Fstyle>\n<!-- The filmmaking tools' shared look: filmmaking-home's style/brand.css, which every tool links to. The Slate keeps no copy of it: its colours, fonts, type classes and dark theme (html[data-theme=\"dark\"], screen only, so printing and PDF export stay light) all come from here. -->\n<link rel=\"stylesheet\" href=\"https://creativemedia.church/filmmaking/style/brand.css\">\n<\u002Fhelmet>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <defs>\n    <g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <symbol id=\"cm-static\" sc-camel-view-box=\"0 0 24 24\"><rect x=\"4\" y=\"7\" width=\"16\" height=\"10\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"1.4\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle>< "M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1\"><\u002Fpath><path d=\"M9 11h6M9 15h6\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-drag\" sc-camel-view-box=\"0 0 24 24\" stroke=\"none\" fill=\"currentColor\"><circle cx=\"9\" cy=\"6\" r=\"1.6\"><\u002Fcircle><circle cx=\"15\" cy=\"6\" r=\"1.6\"><\u002Fcircle><circle cx=\"9\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"15\" cy=\"12\" r=\"1.6\"><\u002Fcircle><circle cx=\"9\" cy=\"18\" r=\"1.6\"><\u002Fcircle><circle cx=\"15\" cy=\"18\" r=\"1.6\"><\u002Fcircle><\u002Fsymbol>\n      <symbol id=\"ui-menu\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M4 7h16M4 12h16M4 17h16\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-close\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-image\" sc-camel-view-box=\"0 0 24 24\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\"><\u002Frect><circle cx=\"8.5\" cy=\"10\" r=\"1.6\"><\u002Fcircle><path d=\"M21 16l-5-5-6 6\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-print\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M7 9V4h10v5M7 18H5v-6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v6h-2M7 15h10v5H7z\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-caret\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M7 10l5 5 5-5\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-cloud\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M7.5 19h9.2a3.8 3.8 0 0 0 .6-7.55A5.6 5.6 0 0 0 6.7 10.3 4.4 4.4 0 0 0 7.5 19z\"><\u002Fpath><path d=\"M12 16.5V9.6M9.4 12.2L12 9.5l2.6 2.7\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-user\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"><\u002Fcircle><path d=\"M3.5 19a5.5 5.5 0 0 1 11 0\"><\u002Fpath><path d=\"M18 8v6M15 11h6\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-comment\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M4 5h16v11H9l-5 4z\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-link\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1\"><\u002Fpath><path d=\"M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-refresh\"sc-camel-view-box=\"0 0 24 24\"><path d=\"M20 12a8 8 0 1 1-2.4-5.7\"><\u002Fpath><path d=\"M20 4v4.5h-4.5\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-sun\" sc-camel-view-box=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-moon\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"><\u002Fpath><\u002Fsymbol>\n      <symbol id=\"ui-pdf\" sc-camel-view-box=\"0 0 24 24\"><path d=\"M6 2h9l5 5v15H6z\"><\u002Fpath><path d=\"M15 2v5h5\"><\u002Fpath><path d=\"M8.5 17.5v-4h1.2a1.2 1.2 0 0 1 0 2.4H8.5M12.3 17.5v-4h1a1.6 1.6 0 0 1 0 4h-1zM17.5 13.5h-2v4M15.5 15.3h1.7\" stroke-width=\"1.6\"><\u002Fpath><\u002Fsymbol>\n    <\u002Fg>\n  <\u002Fdefs>\n<\u002Fsvg>\n\n<sc-if value=\"{{ isMenuView }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"min-height:100vh;background:var(--gray-5)\">\n    <!-- The bar across the top: the filmmaking tools' shared nav, as fm_nav()\n         draws it on the other tools (see .sl-nav in the styles). Wide, the\n         tools, and the person's photo, which opens their links; at 960px\n         and under, one button that opens a panel of everything. Both menus\n         are popovers. Their photo, or initials: slatePhoto(). -->\n    <sc-if value=\"{{ navShown }}\" hint-placeholder-val=\"{{ false }}\">\n      <nav class=\"sl-nav\" aria-label=\"Filmmaking tools\" data-noprint=\"\">\n        <a class=\"home\" href=\"{{ homeUrl }}\">Filmmaking Team<\u002Fa>\n        <span class=\"fm-tools\">\n          <sc-for list=\"{{ navTools }}\" as=\"t\" hint-placeholder-count=\"0\">\n            <sc-if value=\"{{ t.current }}\" hint-placeholder-val=\"{{ false }}\"><a class=\"here\" href=\"{{ t.url }}\" aria-current=\"page\">{{ t.label }}<\u002Fa><\u002Fsc-if>\n            <sc-if value=\"{{ t.other }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"{{ t.url }}\">{{ t.label }}<\u002Fa><\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fspan>\n        <span class=\"spacer\"><\u002Fspan>\n        <sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ false }}\">\n          <button class=\"sl-nav-theme\" type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\" title=\"{{ themeLabel }}\" aria-label=\"{{ themeLabel }}\"><svg width=\"15\" height=\"15\"><use href=\"{{ themeIcon }}\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n          <a class=\"fm-signin\" href=\"{{ signInUrl }}\">Sign in<\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"fm-me\" type=\"button\" popovertarget=\"fm-account\" aria-label=\"{{ accountMenuLabel }}\"><sc-if value=\"{{ mePhotoShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ mePhotoClass }}\" src=\"{{ mePhotoUrl }}\" width=\"{{ mePhotoPx }}\" height=\"{{ mePhotoPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ mePhotoLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ mePhotoClass }}\" aria-hidden=\"true\">{{ mePhotoLetters }}<\u002Fspan><\u002Fsc-if><svg class=\"fm-chevron\" width=\"12\" height=\"12\" aria-hidden=\"true\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n        <\u002Fsc-if>\n        <button class=\"fm-burger\" type=\"button\" popovertarget=\"fm-menu\" aria-label=\"Menu\"><sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\"><sc-if value=\"{{ mePhotoShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ mePhotoClass }}\" src=\"{{ mePhotoUrl }}\" width=\"{{ mePhotoPx }}\" height=\"{{ mePhotoPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ mePhotoLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ mePhotoClass }}\" aria-hidden=\"true\">{{ mePhotoLetters }}<\u002Fspan><\u002Fsc-if><\u002Fsc-if><svg class=\"fm-burger-icon\" width=\"20\" height=\"20\" aria-hidden=\"true\"><use href=\"#ui-menu\"><\u002Fuse><\u002Fsvg><svg class=\"fm-close-icon\" width=\"20\" height=\"20\" aria-hidden=\"true\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg><\u002Fbutton>\n\n        <!-- Wide: who's signed in and their links, under their photo. -->\n        <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"fm-pop fm-account\" id=\"fm-account\" popover=\"\">\n            <div class=\"fm-who\"><sc-if value=\"{{ meBigShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ meBigClass }}\" src=\"{{ meBigUrl }}\" width=\"{{ meBigPx }}\" height=\"{{ meBigPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ meBigLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ meBigClass }}\" aria-hidden=\"true\">{{ meBigLetters }}<\u002Fspan><\u002Fsc-if><span class=\"fm-name\"><strong>{{ signedInAs }}<\u002Fstrong><span>{{ signedInUsername }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <a href=\"{{ accountUrl }}\">Account<\u002Fa>\n            <sc-if value=\"{{ isLibraryAdmin }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ adminUrl }}\">Team Admin<\u002Fa><\u002Fsc-if>\n            <button class=\"sl-nav-theme-row\" type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\"><svg width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"{{ themeIcon }}\"><\u002Fuse><\u002Fsvg>{{ themeRowLabel }}<\u002Fbutton>\n            <form method=\"post\" action=\"{{ logoutUrl }}\">\n              <input type=\"hidden\" name=\"csrf\" value=\"{{ libraryCsrf }}\">\n              <button type=\"submit\">Sign out<\u002Fbutton>\n            <\u002Fform>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- Narrow: the tools, with their blurbs, then the account links. -->\n        <div class=\"fm-pop fm-menu\" id=\"fm-menu\" popover=\"\">\n          <sc-if value=\"{{ hasNavTools }}\" hint-placeholder-val=\"{{ true }}\"><p class=\"fm-sect\">Tools<\u002Fp><\u002Fsc-if>\n          <sc-for list=\"{{ navTools }}\" as=\"t\" hint-placeholder-count=\"0\">\n            <sc-if value=\"{{ t.current }}\" hint-placeholder-val=\"{{ false }}\"><a class=\"fm-tool here\" href=\"{{ t.url }}\" aria-current=\"page\"><span><span class=\"fm-label\">{{ t.label }}<\u002Fspan><sc-if value=\"{{ t.hasBlurb }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"fm-blurb\">{{ t.blurb }}<\u002Fspan><\u002Fsc-if><\u002Fspan><span class=\"fm-tag\">Here<\u002Fspan><\u002Fa><\u002Fsc-if>\n            <sc-if value=\"{{ t.other }}\" hint-placeholder-val=\"{{ true }}\"><a class=\"fm-tool\" href=\"{{ t.url }}\"><span><span class=\"fm-label\">{{ t.label }}<\u002Fspan><sc-if value=\"{{ t.hasBlurb }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"fm-blurb\">{{ t.blurb }}<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fa><\u002Fsc-if>\n          <\u002Fsc-for>\n          <div class=\"fm-menu-account\">\n            <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\">\n              <div class=\"fm-who\"><sc-if value=\"{{ meBigShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ meBigClass }}\" src=\"{{ meBigUrl }}\" width=\"{{ meBigPx }}\" height=\"{{ meBigPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ meBigLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ meBigClass }}\" aria-hidden=\"true\">{{ meBigLetters }}<\u002Fspan><\u002Fsc-if><span class=\"fm-name\"><strong>{{ signedInAs }}<\u002Fstrong><span>{{ signedInUsername }}<\u002Fspan><\u002Fspan><\u002Fdiv>\n              <a href=\"{{ accountUrl }}\">Account<\u002Fa>\n              <sc-if value=\"{{ isLibraryAdmin }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ adminUrl }}\">Team Admin<\u002Fa><\u002Fsc-if>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ signedOut }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"{{ signInUrl }}\">Sign in<\u002Fa><\u002Fsc-if>\n            <button class=\"sl-nav-theme-row\" type=\"button\" sc-camel-on-click=\"{{ toggleTheme }}\"><svg width=\"14\" height=\"14\" aria-hidden=\"true\"><use href=\"{{ themeIcon }}\"><\u002Fuse><\u002Fsvg>{{ themeRowLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ signedIn }}\" hint-placeholder-val=\"{{ true }}\">\n              <form method=\"post\" action=\"{{ logoutUrl }}\">\n                <input type=\"hidden\" name=\"csrf\" value=\"{{ libraryCsrf }}\">\n                <button type=\"submit\">Sign out<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fnav>\n    <\u002Fsc-if>\n    <div class=\"sl-menu-inner\" style=\"max-width:1164px;margin:0 auto;padding:40px 32px 48px;box-sizing:border-box\">\n      <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray-30);margin-bottom:8px\">Storyboard<\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:32px\">\n        <div>\n          <div class=\"sl-h1\" style=\"font-family:var(--font-display);font-weight:900;font-size:40px;line-height:0.9;letter-spacing:-0.02em;text-transform:uppercase;color:var(--black)\">Your Storyboards<\u002Fdiv>\n          <!-- \"3 storyboards · 12 in team library\": in the top bar before it was the tools' shared one. -->\n          <div style=\"font-family:var(--font-mono);font-size:11px;color:var(--gray-30);margin-top:10px\">{{ navMeta }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ newBoard }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">\n          <svg width=\"18\" height=\"18\" style=\"stroke:#FFFFFF;fill:#FFFFFF;stroke-width:4px\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>New Shot List\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ noBoards }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border:2px dashed var(--gray-20);background:var(--white);padding:64px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px\">\n          <svg width=\"40\" height=\"40\" style=\"color:var(--gray-20)\"><use href=\"#ui-grid\"><\u002Fuse><\u002Fsvg>\n          <div style=\"font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:-0.01em;text-transform:uppercase;color:var(--black)\">No storyboards yet<\u002Fdiv>\n          <div style=\"font-size:14px;color:var(--gray-30)\">Start a new shot list to begin planning your shots.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:18px\">\n        <sc-for list=\"{{ boards }}\" as=\"b\" hint-placeholder-count=\"0\">\n          <div sc-camel-on-click=\"{{ openBoard }}\" data-id=\"{{ b.id }}\" style=\"background:var(--white);border:1px solid var(--gray-15);padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative\" style-hover=\"border-color:var(--black)\">\n            <button data-id=\"{{ b.id }}\" sc-camel-on-click=\"{{ deleteBoard }}\" title=\"{{ b.deleteTitle }}\" aria-label=\"{{ b.deleteTitle }}\" data-noprint=\"\" style=\"position:absolute;top:12px;right:12px;width:28px;height:28px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"color:var(--red-500);border-color:var(--red-500)\">\n              <svg width=\"15\" height=\"15\"><use href=\"#ui-trash\"><\u002Fuse><\u002Fsvg>\n            <\u002Fbutton>\n            <div style=\"font-family:var(--font-display);font-weight:900;font-size:19px;letter-spacing:-0.01em;text-transform:uppercase;color:var(--black);padding-right:30px\">{{ b.title }}<\u002Fdiv>\n            <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--gray-30);margin-top:4px\">{{ b.shotLabel }} · Updated {{ b.updatedLabel }}<\u002Fdiv>\n            <sc-if value=\"{{ b.hasShareLine }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--cglp-blue)\">\n                <sc-if value=\"{{ b.hasOwnerPhoto }}\" hint-placeholder-val=\"{{ false }}\"><sc-if value=\"{{ b.ownerShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ b.ownerClass }}\" src=\"{{ b.ownerUrl }}\" width=\"{{ b.ownerPx }}\" height=\"{{ b.ownerPx }}\" alt=\"\" style=\"width:20px;height:20px;font-size:8px\"><\u002Fsc-if><sc-if value=\"{{ b.ownerLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ b.ownerClass }}\" aria-hidden=\"true\" style=\"width:20px;height:20px;font-size:8px\">{{ b.ownerLetters }}<\u002Fspan><\u002Fsc-if><\u002Fsc-if>\n                <sc-if value=\"{{ b.noOwnerPhoto }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"13\" height=\"13\"><use href=\"#ui-user\"><\u002Fuse><\u002Fsvg><\u002Fsc-if>{{ b.shareLine }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ b.hasCommentLine }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--gray-40)\">\n                <svg width=\"13\" height=\"13\"><use href=\"#ui-comment\"><\u002Fuse><\u002Fsvg>{{ b.commentLine }}\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ b.hasRequestLine }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"align-self:flex-start;margin-top:4px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;color:#fff;background:var(--cglp-blue);padding:3px 7px\">{{ b.requestLine }}<\u002Fdiv>\n            <\u002Fsc-if>\n e:13px;font-weight:600;color:var(--gray-40)\">{{ l.project }}<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--gray-30);margin-top:4px\">{{ l.line }}<\u002Fdiv>\n                <sc-if value=\"{{ l.hasOwner }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--gray-40)\"><sc-if value=\"{{ l.ownerShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ l.ownerClass }}\" src=\"{{ l.ownerUrl }}\" width=\"{{ l.ownerPx }}\" height=\"{{ l.ownerPx }}\" alt=\"\" style=\"width:20px;height:20px;font-size:8px\"><\u002Fsc-if><sc-if value=\"{{ l.ownerLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ l.ownerClass }}\" aria-hidden=\"true\" style=\"width:20px;height:20px;font-size:8px\">{{ l.ownerLetters }}<\u002Fspan><\u002Fsc-if>{{ l.ownerLine }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <!-- Trash: deleted boards stay here for {{ trashDays }} days (slate_housekeeping()). -->\n          <div style=\"margin-top:56px;border-top:1px solid var(--gray-15);padding-top:32px\">\n            <div style=\"display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:20px\">\n              <div>\n                <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray-30);margin-bottom:8px\">Deleted<\u002Fdiv>\n                <div class=\"sl-h1\" style=\"font-family:var(--font-display);font-weight:900;font-size:40px;line-height:0.9;letter-spacing:-0.02em;text-transform:uppercase;color:var(--black)\">Trash<\u002Fdiv>\n                <div style=\"font-size:13px;color:var(--gray-30);margi
