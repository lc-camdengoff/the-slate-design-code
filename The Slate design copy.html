 }}\" style=\"width:100%;height:100%;object-fit:contain;display:block;user-select:none;pointer-events:none\">\n          <\u002Fsc-if>\n          <sc-if value=\"{{ onsetHasClip }}\" hint-placeholder-val=\"{{ false }}\">\n            <video src=\"{{ onsetClip }}\" ref=\"{{ setClipRef }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none\"><\u002Fvideo>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ onsetNoImage }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#5C5D63;font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase\">No picture<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"position:absolute;top:10px;left:10px;background:#000;color:var(--cglp-blue);font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:0.06em;padding:4px 9px\">{{ onsetBadge }}<\u002Fdiv>\n          <div style=\"position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);color:#C6C7CB;font-family:var(--font-mono);font-size:12px;padding:4px 9px\">{{ onsetPosition }}<\u002Fdiv>\n          <sc-if value=\"{{ onsetHasStatus }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"{{ onsetStatusChip }}\">{{ onsetStatusLabel }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px\">\n          <sc-for list=\"{{ onsetFacts }}\" as=\"x\" hint-placeholder-count=\"0\">\n            <span><span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#8E8F95;margin-right:6px\">{{ x.label }}<\u002Fspan><strong>{{ x.value }}<\u002Fstrong><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ onsetTexts }}\" as=\"x\" hint-placeholder-count=\"0\">\n          <div>\n            <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:#8E8F95;margin-bottom:3px\">{{ x.label }}<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.45;white-space:pre-wrap;color:#E2E2E5\">{{ x.value }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ onsetCanMark }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n            <sc-for list=\"{{ onsetButtons }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <button data-key=\"{{ b.key }}\" sc-camel-on-click=\"{{ markOnset }}\" aria-pressed=\"{{ b.pressed }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <textarea value=\"{{ onsetNote }}\" sc-camel-on-input=\"{{ onOnsetNote }}\" placeholder=\"On-set note: take 4 is the one, lost light, pick up tomorrow…\" rows=\"2\" maxlength=\"200\" style=\"width:100%;box-sizing:border-box;background:#1B1E22;border:1px solid #3A3D44;color:#F2F2F2;font:inherit;font-size:15px;padding:10px 12px;resize:vertical\"><\u002Ftextarea>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ onsetHasWho }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:#A3A4A9\">{{ onsetWho }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ onsetViewOnly }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:13px;color:#A3A4A9\">You can see progress here. Marking shots needs comment or edit access to this storyboard.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasOnsetError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-left:4px solid #E07070;padding:8px 12px;font-size:13px;color:#E2E2E5\">{{ onsetError }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid #2A2D33\">\n        <button sc-camel-on-click=\"{{ onsetPrev }}\" sc-camel-disabled=\"{{ onsetAtFirst }}\" style=\"{{ onsetNavStyle }}\">‹ Prev<\u002Fbutton>\n        <div style=\"flex:1;display:flex;gap:6px;overflow-x:auto;padding:2px 0\">\n          <sc-for list=\"{{ onsetStrip }}\" as=\"t\" hint-placeholder-count=\"0\">\n            <button data-id=\"{{ t.id }}\" sc-camel-on-click=\"{{ onsetJump }}\" title=\"{{ t.title }}\" style=\"{{ t.style }}\">\n              <sc-if value=\"{{ t.hasImage }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ t.image }}\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\"><\u002Fsc-if>\n              <span style=\"{{ t.barStyle }}\"><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onsetNext }}\" sc-camel-disabled=\"{{ onsetAtLast }}\" style=\"{{ onsetNavStyle }}\">Next ›<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- A link to a storyboard I can't open: ask its owner for access. -->\n<sc-if value=\"{{ requestOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"sl-share-wrap\" data-noprint=\"\" sc-camel-on-click=\"{{ closeRequest }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px;overflow:auto\">\n    <div class=\"sl-share-card sl-request-card\" role=\"dialog\" aria-label=\"Request access\" sc-camel-on-click=\"{{ stopShareClick }}\" style=\"width:460px;max-width:100%;background:var(--white);border:1px solid var(--gray-15);box-shadow:var(--shadow-2);padding:24px;display:flex;flex-direction:column;gap:16px;color:var(--black)\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n        <div>\n          <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray-30);margin-bottom:6px\">Shared link<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:900;font-size:24px;line-height:1;letter-spacing:-0.01em;text-transform:uppercase\">You need access<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeRequest }}\" title=\"Close\" aria-label=\"Close\" style=\"width:32px;height:32px;flex:0 0 32px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\" style-hover=\"border-color:var(--black);color:var(--black)\">\n          <svg width=\"15\" height=\"15\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ requestAsking }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:14px;color:var(--gray-50)\">This storyboard hasn’t been shared with you. Ask its owner, and they’ll see your request the next time they open the Slate.<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <button data-level=\"edit\" sc-camel-on-click=\"{{ requestAccess }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">Ask to edit<\u002Fbutton>\n          <button data-level=\"comment\" sc-camel-on-click=\"{{ requestAccess }}\" style=\"height:44px;padding:0 18px;background:transparent;border:1px solid var(--gray-20);color:var(--gray-50);font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"border-color:var(--black);color:var(--black)\">Ask to comment<\u002Fbutton>\n          <button data-level=\"view\" sc-camel-on-click=\"{{ requestAccess }}\" style=\"height:44px;padding:0 18px;background:transparent;border:1px solid var(--gray-20);color:var(--gray-50);font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"border-color:var(--black);color:var(--black)\">Ask to view<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ requestSending }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-size:12px;color:var(--gray-40)\">Sending…<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ requestSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-left:4px solid var(--cglp-blue);padding:8px 12px;font-size:14px;color:var(--gray-50)\">{{ requestSentNote }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ requestGone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:14px;color:var(--gray-50)\">That storyboard doesn’t exist any more. It may have been deleted; ask whoever sent the link.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasRequestError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid var(--red-500);color:var(--red-500);padding:10px 12px;font-size:13px\">{{ requestError }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ requestDone }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;justify-content:flex-end\">\n          <button sc-camel-on-click=\"{{ closeRequest }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">Done<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- From ShotDeck or From FrameSet (sdSource): stills copied or dragged from it, open in a window\n     beside the Slate, wait here until Add makes them shots. A drop\n     anywhere over the panel counts, not only on the box. -->\n<sc-if value=\"{{ sdOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"sl-share-wrap\" data-noprint=\"\" sc-camel-on-click=\"{{ closeShotDeck }}\" sc-camel-on-drag-over=\"{{ onShotDeckDragOver }}\" sc-camel-on-drop=\"{{ onShotDeckDrop }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;overflow:auto\">\n    <div class=\"sl-share-card\" role=\"dialog\" aria-label=\"{{ sdTitle }}\" sc-camel-on-click=\"{{ stopShareClick }}\" style=\"width:640px;max-width:100%;background:var(--white);border:1px solid var(--gray-15);box-shadow:var(--shadow-2);padding:24px;display:flex;flex-direction:column;gap:16px;color:var(--black)\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n        <div style=\"min-width:0\">\n          <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray-30);margin-bottom:6px\">{{ sdEyebrow }}<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:900;font-size:24px;line-height:1;letter-spacing:-0.01em;text-transform:uppercase\">{{ sdTitle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeShotDeck }}\" title=\"Close\" aria-label=\"Close\" style=\"width:32px;height:32px;flex:0 0 32px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\" style-hover=\"border-color:var(--black);color:var(--black)\">\n          <svg width=\"15\" height=\"15\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n        <button sc-camel-on-click=\"{{ launchShotDeck }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">{{ sdOpenLabel }}<\u002Fbutton>\n        <span style=\"flex:1 1 220px;font-size:13px;color:var(--gray-40)\">{{ sdOpenNote }}<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ sdOfferExtension }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--gray-15);padding:10px 12px\">\n          <span style=\"flex:1 1 260px;font-size:13px;color:var(--gray-50)\">With the Send to the Slate extension, right-click any still on ShotDeck or FrameSet to send it here, no copying needed.<\u002Fspan>\n          <a href=\"{{ sdExtensionUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"height:32px;padding:0 12px;display:flex;align-items:center;border:1px solid var(--gray-20);color:var(--black);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;text-decoration:none;white-space:nowrap\" style-hover=\"border-color:var(--black)\">Get the extension<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sdExtension }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-left:4px solid var(--cglp-blue);padding:8px 12px;font-size:13px;color:var(--gray-50)\">Send to the Slate is on. On ShotDeck or FrameSet, right-click any still and choose Send to the Slate, or use the button on a ShotDeck still's page. Stills you send come in here while this panel is open.<\u002Fdiv>\n      <\u002Fsc-if>\n      <label data-zone=\"\" sc-camel-on-drag-over=\"{{ onShotDeckDragOver }}\" sc-camel-on-drag-leave=\"{{ onShotDeckDragLeave }}\" sc-camel-on-drop=\"{{ onShotDeckDrop }}\" style=\"border:2px dashed var(--gray-20);padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer\">\n        <input type=\"file\" accept=\"image/*\" multiple=\"\" sc-camel-on-change=\"{{ onShotDeckPick }}\" style=\"display:none\">\n        <svg width=\"34\" height=\"34\" style=\"color:var(--gray-20);pointer-events:none\"><use href=\"#ui-image\"><\u002Fuse><\u002Fsvg>\n        <span style=\"font-family:var(--font-display);font-weight:900;font-size:18px;text-transform:uppercase;pointer-events:none\">{{ sdDropTitle }}<\u002Fspan>\n        <span style=\"font-size:13px;color:var(--gray-40);max-width:440px;pointer-events:none\">{{ sdDropText }}<\u002Fspan>\n        <sc-if value=\"{{ hasSdDropMore }}\" hint-placeholder-val=\"{{ true }}\">\n          <span style=\"font-size:12px;color:var(--gray-30);max-width:440px;pointer-events:none\">{{ sdDropMore }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Flabel>\n      <sc-if value=\"{{ hasSdNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border-left:4px solid var(--red-500);padding:8px 12px;font-size:13px;color:var(--gray-50)\">{{ sdNote }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <!-- The storyboard's pool, newest first: click to pick (numbered in the\n           order picked), x to take out of the pool. Used ones say where. -->\n      <sc-if value=\"{{ sdHasItems }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30)\">{{ sdPoolLine }}<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:300px;overflow:auto\">\n          <sc-for list=\"{{ sdItems }}\" as=\"p\" hint-placeholder-count=\"0\">\n            <div style=\"position:relative\">\n              <button data-id=\"{{ p.id }}\" sc-camel-on-click=\"{{ pickShotDeckItem }}\" aria-pressed=\"{{ p.pickedStr }}\" title=\"{{ p.pickTitle }}\" style=\"{{ p.boxStyle }}\">\n                <img src=\"{{ p.src }}\" alt=\"\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n              <\u002Fbutton>\n              <sc-if value=\"{{ p.isPicked }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute;top:4px;left:4px;min-width:20px;height:20px;background:var(--cglp-blue);color:#fff;font-family:var(--font-mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none\">{{ p.order }}<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.isUsed }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute;bottom:4px;left:4px;background:var(--black);color:var(--cglp-blue);font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.06em;padding:2px 6px;pointer-events:none\">{{ p.usedLabel }}<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ p.isClip }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:0.08em;padding:2px 5px;pointer-events:none\">Clip<\u002Fspan>\n              <\u002Fsc-if>\n              <button data-id=\"{{ p.id }}\" sc-camel-on-click=\"{{ removeShotDeckItem }}\" title=\"Remove from this storyboard's pool\" aria-label=\"Remove from the pool\" style=\"position:absolute;top:4px;right:4px;width:22px;height:22px;background:rgba(0,0,0,0.55);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\">\n                <svg width=\"12\" height=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sdBusyNow }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:var(--gray-40)\">{{ sdBusyLabel }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <div class=\"sl-sd-foot\" style=\"display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;border-top:1px solid var(--gray-10);padding-top:16px\">\n        <span style=\"flex:1 1 220px;font-size:13px;color:var(--gray-40)\">{{ sdSummary }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ closeShotDeck }}\" style=\"height:44px;padding:0 18px;background:transparent;border:1px solid var(--gray-20);color:var(--gray-50);font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"border-color:var(--black);color:var(--black)\">Cancel<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ addShotDeckShots }}\" sc-camel-disabled=\"{{ sdAddDisabled }}\" style=\"{{ sdAddStyle }}\">{{ sdAddLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#56C4E5&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;,&quot;options&quot;:[&quot;#1D242B&quot;,&quot;#56C4E5&quot;,&quot;#367899&quot;]},&quot;startLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Defaults&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;filmstrip&quot;,&quot;list&quot;]}}\">\nconst KEY = 'cg_storyboard_v1';\nconst INDEX_KEY = 'cg_storyboard_boards_index';\n// Per board: what it looked like when it last matched the server (see syncStampOf).\nconst SYNCED_KEY = 'cg_storyboard_synced';\n// Light or dark, remembered per browser. Until someone picks, follow the\n// computer's own setting.\nconst THEME_KEY = 'cg_storyboard_theme';\nfunction slateInitialTheme() {\n  try {\n    const saved = localStorage.getItem(THEME_KEY);\n    if (saved === 'dark' || saved === 'light') return saved;\n  } catch (e) { /* storage blocked: fall through */ }\n  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';\n}\nconst CLIPBOARD_KEY = 'cg_storyboard_clipboard';\nconst boardKey = (id) => 'cg_storyboard_board_' + id;\nconst IDB_NAME = 'cg_storyboard_db';\nconst IDB_STORE = 'boards';\nlet idbPromise = null;\nfunction idbOpen() {\n  if (idbPromise) return idbPromise;\n  idbPromise = new Promise((resolve, reject) => {\n    const req = indexedDB.open(IDB_NAME, 1);\n    req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n  return idbPromise;\n}\nasync function idbSet(id, value) {\n  const db = await idbOpen();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(IDB_STORE, 'readwrite');\n    tx.objectStore(IDB_STORE).put(value, id);\n    tx.oncomplete = () => resolve();\n    tx.onerror = () => reject(tx.error);\n  });\n}\nasync function idbGet(id) {\n  const db = await idbOpen();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(IDB_STORE, 'readonly');\n    const req = tx.objectStore(IDB_STORE).get(id);\n    req.onsuccess = () => resolve(req.result || null);\n    req.onerror = () => reject(req.error);\n  });\n}\nasync function idbDel(id) {\n  const db = await idbOpen();\n  return new Promise((resolve, reject) => {\n    const tx = db.transaction(IDB_STORE, 'readwrite');\n    tx.objectStore(IDB_STORE).delete(id);\n    tx.oncomplete = () => resolve();\n    tx.onerror = () => reject(tx.error);\n  });\n}\n// Team library: storyboards shared through the server folder next to this one.\n// The endpoints only exist when a web server is serving the page; opened\n// straight off disk the app still works, minus the library.\nconst LIB_ENABLED = true; // the design copy: its stand-in server answers (tools/bundle.py design)\n\n// Signed out mid-session — the cookie expired, or an admin turned the account\n// off. Nothing the app can do but send them back to the sign-in page, which is\n// what a reload lands on.\nlet libSignedOut = false;\nfunction libSignedOutNotice() {\n  if (libSignedOut) return;\n  libSignedOut = true;\n  window.alert('Your sign-in has expired. Taking you back to the sign-in page — your work is saved on this computer.');\n  window.location.reload();\n}\n\nasync function libRequest(url, options) {\n  const res = await fetch(url, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, options || {}));\n  let data = null;\n  try { data = await res.json(); } catch (err) {}\n  if (res.status === 401) libSignedOutNotice() ure's From ShotDeck.\nconst SHOTDECK_URL = 'https://shotdeck.com/browse/stills';\n// The libraries the panel opens beside the Slate. FrameSet keeps its stills\n// on an image server that lets any site read them, so a drag from it comes\n// straight in; ShotDeck's need a paste (or the extension).\nconst SLATE_SOURCES = {\n  shotdeck: { name: 'ShotDeck', url: SHOTDECK_URL, win: 'slate-shotdeck',\n    dropTitle: 'Paste stills here', dropText: 'On ShotDeck, right-click a still and choose Copy Image, then come back and press {keys}. Do it again for each still you want.',\n    touchText: 'On ShotDeck, press and hold a still and save it to your photos. Then come back and tap here to choose it, and any others you saved.' },\n  frameset: { name: 'FrameSet', url: 'https://frameset.app/', win: 'slate-frameset',\n    dropTitle: 'Drag or paste stills here', dropText: 'Open a still or a clip on FrameSet and drag it here; clips keep moving. Or right-click a still, choose Copy Image, and press {keys} here.',\n    touchText: 'On FrameSet, press and hold a still and save it to your photos. Then come back and tap here to choose it, and any others you saved.' },\n};\nfunction slateSource(key) { return SLATE_SOURCES[key] || SLATE_SOURCES.shotdeck; }\n// A phone or tablet: no mouse to right-click or drag with, and no keys to\n// paste with, so the panel says to save stills to the photos instead.\nfunction slateTouchOnly() { return !!(window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches); }\n// A still's own address, as a drag from ShotDeck's full-size view brings:\n// what still.php fetches for the app (and the only thing it will).\nconst SHOTDECK_STILL = /^https:\\/\\/(?:www\\.)?shotdeck\\.com\\/assets\\/images\\/stills\\/[^?#]+\\.(?:jpe?g|png|webp)(?:[?#].*)?$/i;\n// Most of ShotDeck's stills it gives only to signed-in members, which the\n// server isn't (still.php says still_needs_login); only the few it makes\n// public come over by dragging.\nfunction slateCopyImageTip(onShot, err, name) {\n  const keys = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent || '') ? '\\u2318V' : 'Ctrl+V';\n  const why = err && err.message === 'still_needs_login'\n    ? 'ShotDeck only gives that still to signed-in members, so it can\\'t come over by dragging.'\n    : (onShot ? 'That picture' : 'That still') + ' couldn\\'t be brought over by dragging.';\n  return why + (onShot\n    ? ' Click this shot\\'s picture and choose From ShotDeck or From FrameSet, then right-click the picture, choose Copy Image, and press ' + keys + ' in the panel.'\n    : ' Right-click it on ' + (name || 'ShotDeck') + ' instead, choose Copy Image, and press ' + keys + ' here.');\n}\n// The Send to the Slate browser extension (the_slate's extension/). Stills\n// sent from ShotDeck with it wait in the extension until a board's ShotDeck\n// panel is open, then come in as messages on this window. The panel says\n// whether it's open (shotdeck-ready) and which stills it took\n// (shotdeck-taken), so none is lost or added twice.\nconst SLATE_EXT_FROM = 'slate-extension';\nconst SLATE_EXT_TO = 'the-slate';\nconst SLATE_EXT_STILL = /^data:image\\/(?:jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/;\nconst SLATE_EXT_MAX_CHARS = 42000000;  // a 30 MB GIF, as base64\n// Moving clips. An animated GIF (as FrameSet's clips are) becomes a clip: a\n// short WebM video, many times smaller than the GIF, which plays on the card,\n// muted and looping, with its first frame as the shot's picture for\n// everything else (print, PDF, the pool's labels). A shot then has\n// image (that frame) and clip (data:video/webm). Where the browser can't\n// convert (no WebCodecs), a GIF up to CLIP_MAX_BYTES stays a GIF instead.\nconst CLIP_MAX_BYTES = 5 * 1024 * 1024;\nconst CLIP_GIF_MAX_BYTES = 30 * 1024 * 1024;  // a GIF bigger than this comes in as a still\nconst CLIP_MAX_PX = 1280;\nconst CLIP_MAX_SECONDS = 60;\nconst CLIP_TARGET_BYTES = 3 * 1024 * 1024;   // the video's size, el([0x86], enc.encode(codecId)),\n      el([0xE0], [el([0xB0], uint(width)), el([0xBA], uint(height))]),\n    ])]),\n  ];\n  let cluster = null, clusterMs = 0;\n  const flush = () => { if (cluster) body.push(el([0x1F, 0x43, 0xB6, 0x75], cluster)); };\n  frames.forEach(fr => {\n    if (!cluster || fr.key || fr.ms - clusterMs > 30000) {\n      flush();\n      clusterMs = fr.ms;\n      cluster = [el([0xE7], uint(fr.ms))];\n    }\n    const rel = fr.ms - clusterMs;\n    const head = new Uint8Array([0x81, (rel >> 8) & 255, rel & 255, fr.key ? 0x80 : 0x00]);\n    cluster.push(el([0xA3], cat([head, fr.data])));\n  });\n  flush();\n  parts.push(el([0x18, 0x53, 0x80, 0x67], body));\n  return cat(parts);\n}\nfunction slateBase64(bytes) {\n  let bin = '';\n  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));\n  return btoa(bin);\n}\n// An animated GIF as a clip: { src: its first frame, shrunk as any picture\n// (by shrink, given a canvas), clip: data:video/webm }, or null where it\n// can't be (no WebCodecs, one frame, too long).\nasync function slateGifToClip(bytes, shrink) {\n  if (!slateCanMakeClips() || !(await ImageDecoder.isTypeSupported('image/gif'))) return null;\n  const dec = new ImageDecoder({ data: bytes, type: 'image/gif' });\n  try {\n    await dec.tracks.ready;\n    const count = dec.tracks.selectedTrack ? dec.tracks.selectedTrack.frameCount : 0;\n    if (count < 2) return null;\n    const first = (await dec.decode({ frameIndex: 0 })).image;\n    const scale = Math.min(1, CLIP_MAX_PX / Math.max(first.displayWidth, first.displayHeight));\n    // Even sizes, as video encoders want.\n    const w = Math.max(2, Math.round(first.displayWidth * scale / 2) * 2);\n    const h = Math.max(2, Math.round(first.displayHeight * scale / 2) * 2);\n    first.close();\n    // The frames' times, GIF delays under 20ms played as browsers do (100ms).\n    const durations = [];\n    let total = 0;\n    for (let i = 0; i < count; i++) {\n      const fr = (await dec.decode({ frameIndex: i })).image;\n      const d = fr.duration && fr.duration >= 20000 ? fr.duration : 100000;\n      fr.close();\n      durations.push(d);\n      total += d;\n    }\n    if (total / 1e6 > CLIP_MAX_SECONDS) return null;\n    const bitrate = Math.max(300000, Math.min(2500000, Math.floor(CLIP_TARGET_BYTES * 8 / Math.max(1, total / 1e6))));\n    let codec = null;\n    for (const c of ['vp09.00.10.08', 'vp8']) {\n      const ok = await VideoEncoder.isConfigSupported({ codec: c, width: w, height: h, bitrate, framerate: 30 }).catch(() => null);\n      if (ok && ok.supported) { codec = c; break; }\n    }\n    if (!codec) return null;\n    const chunks = [];\n    let failed = null;\n    const encoder = new VideoEncoder({\n      output: (chunk) => { const b = new Uint8Array(chunk.byteLength); chunk.copyTo(b); chunks.push({ data: b, ms: Math.round(chunk.timestamp / 1000), key: chunk.type === 'key' }); },\n      error: (e) => { failed = e; },\n    });\n    encoder.configure({ codec, width: w, height: h, bitrate, framerate: 30 });\n    const canvas = document.createElement('canvas');\n    canvas.width = w; canvas.height = h;\n    const ctx = canvas.getContext('2d');\n    let poster = '', t = 0, lastKey = -Infinity;\n    for (let i = 0; i < count && !failed; i++) {\n      const fr = (await dec.decode({ frameIndex: i })).image;\n      ctx.fillStyle = '#FFFFFF';\n      ctx.fillRect(0, 0, w, h);\n      ctx.drawImage(fr, 0, 0, w, h);\n      fr.close();\n      if (i === 0) poster = shrink(canvas);\n      const vf = new VideoFrame(canvas, { timestamp: t, duration: durations[i] });\n      const key = t - lastKey >= 2e6;\n      if (key) lastKey = t;\n      encoder.encode(vf, { keyFrame: key });\n      vf.close();\n      t += durations[i];\n      while (encoder.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5));\n    }\n    await encoder.flush();\n    encoder.close();\n    if (failed || !chunks.length) return null;\n    chunks.sort((a, b) => a.ms - b.ms);\n    const webm = slateWebm(chunks, codec.indexOf('vp09') === 0 ? 'V_VP9' : 'V_VP8', w, h, total / 1000);\n    return { src: poster, clip: 'data:video/webm;base64,' + slateBase64(webm), bytes: webm.length };\n  } finally {\n    dec.close();\n  }\n}\nfunction slateIsAnimatedGif(bytes) {\n  if (bytes.length < 6 || String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]) !== 'GIF8') return false;\n  // More than one frame: more than one graphic control block (21 F9 04).\n  let n = 0;\n  for (let i = 0; i < bytes.length - 2; i++) {\n    if (bytes[i] === 0x21 && bytes[i + 1] === 0xF9 && bytes[i + 2] === 0x04 && ++n > 1) return true;\n  }\n  return false;\n}\n// What a picture is, from its first bytes: servers don't always say\n// (FrameSet's sends its clips as binary/octet-stream).\nfunction slatePictureType(head) {\n  const b = head;\n  if (b[0] === 0xFF && b[1] === 0xD8 && b[2] === 0xFF) return 'image/jpeg';\n  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4E && b[3] === 0x47) return 'image/png';\n  if (b[0] === 0x47 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x38) return 'image/gif';\n  if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';\n  return '';\n}\n// The Accept a browser sends for a picture: FrameSet's image server answers\n// a fetch that says so.\nconst SLATE_PICTURE_ACCEPT = 'image/avif,image/webp,image/apng,image/*,*/*;q=0.8';\nfunction slatePic(v) {\n  return v && typeof v === 'object' ? { src: v.src, clip: slateIsClip(v.clip) ? v.clip : '' } : { src: v, clip: '' };\n}\nfunction slateMegabytes(n) { return (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + ' MB'; }\n// The server's page for installing it (the_slate's extension.php), where\n// it's downloaded and loaded unpacked, in Chrome and the browsers built on\n// it. It isn't in the Chrome Web Store.\nconst SLATE_EXT_INSTALL_URL = 'extension.php';\nc
