ray-5)\">\n        <svg width=\"15\" height=\"15\" style=\"transform:rotate(90deg)\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>All Storyboards\n      <\u002Fbutton>\n      <div data-noprint=\"\" style=\"display:flex;align-items:center;gap:8px\">\n        <div class=\"sl-tb-phonehide\" style=\"position:relative\">\n          <button sc-camel-on-click=\"{{ toggleExportMenu }}\" title=\"Print, export or import this storyboard\" style=\"display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-50);font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"background:var(--gray-5)\">\n            <svg width=\"16\" height=\"16\"><use href=\"#ui-copy\"><\u002Fuse><\u002Fsvg>File\n            <svg width=\"14\" height=\"14\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n          <\u002Fbutton>\n          <sc-if value=\"{{ exportMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div data-noprint=\"\" sc-camel-on-click=\"{{ closeExportMenu }}\" style=\"position:fixed;inset:0;z-index:40\"><\u002Fdiv>\n            <div data-noprint=\"\" style=\"position:absolute;top:38px;right:0;width:190px;background:var(--white);border:1px solid var(--gray-15);box-shadow:var(--shadow-2);padding:6px;z-index:41;display:flex;flex-direction:column;gap:2px\">\n              <button sc-camel-on-click=\"{{ printBoard }}\" style=\"padding:8px 10px;border:none;background:var(--white);cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--black)\" style-hover=\"background:var(--gray-5)\">\n                <svg width=\"15\" height=\"15\"><use href=\"#ui-print\"><\u002Fuse><\u002Fsvg>Print\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ exportPdf }}\" style=\"padding:8px 10px;border:none;background:var(--white);cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--black)\" style-hover=\"background:var(--gray-5)\">\n                <svg width=\"15\" height=\"15\"><use href=\"#ui-pdf\"><\u002Fuse><\u002Fsvg>Export a PDF\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ exportBoard }}\" style=\"padding:8px 10px;border:none;background:var(--white);cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--black)\" style-hover=\"background:var(--gray-5)\">\n                <svg width=\"15\" height=\"15\"><use href=\"#ui-copy\"><\u002Fuse><\u002Fsvg>Export the project\n              <\u002Fbutton>\n              <label class=\"sl-edit-only\" style=\"padding:8px 10px;border:none;background:var(--white);cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--black)\" style-hover=\"background:var(--gray-5)\">\n                <svg width=\"15\" height=\"15\"><use href=\"#ui-image\"><\u002Fuse><\u002Fsvg>Import a project\n                <input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ importBoard }}\" style=\"display:none\">\n              <\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleTheme }}\" data-noprint=\"\" title=\"{{ themeLabel }}\" aria-label=\"{{ themeLabel }}\" style=\"width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--gray-15);color:var(--gray-50);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\" style-hover=\"border-color:var(--black);color:var(--black)\">\n        <svg width=\"15\" height=\"15\"><use href=\"{{ themeIcon }}\"><\u002Fuse><\u002Fsvg>\n      <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1440px;margin:0 auto\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:space-between\">\n        <div class=\"sl-title-box\" style=\"flex:1;min-width:280px\">\n          <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray-30);margin-bottom:8px\">Storyboard<\u002Fdiv>\n          <input class=\"sl-title-input\" data-field=\"title\" sc-camel-default-value=\"{{ meta.title }}\" sc-camel-on-input=\"{{ onMetaInput }}\" placeholder=\"UNTITLED STORYBOARD\" style=\"font-family:var(--font-display);font-weight:900;font-size:40px;line-height:0.9;letter-spacing:-0.02em;text-transform:uppercase;color:var(--black);border:none;background:transparent;width:100%;padding:0 0 4px\">\n        <\u002Fdiv>\n        <div class=\"sl-colorkey\" style=\"padding:14px 16px;flex:0 0 auto;min-width:260px\">\n          <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30);margin-bottom:10px\">Color Key<\u002Fdiv>\n          <div class=\"sl-keygrid\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 18px\">\n            <sc-for list=\"{{ tagKey }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:6px\">\n                <span style=\"{{ t.swatchStyle }}\"><\u002Fspan>\n                <input data-key=\"{{ t.key }}\" data-print-hint=\"\" value=\"{{ t.label }}\" sc-camel-on-input=\"{{ onTagLabelInput }}\" placeholder=\"{{ t.placeholder }}\" style=\"font-size:13px;font-weight:600;border:none;background:transparent;padding:2px 0;width:100%;min-width:0\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sl-meta\" style=\"display:flex;flex-wrap:wrap;gap:26px;margin-top:16px\">\n        <label style=\"display:flex;flex-direction:column;gap:3px;min-width:150px\">\n          <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30)\">Project / Client<\u002Fspan>\n          <input data-field=\"project\" sc-camel-default-value=\"{{ meta.project }}\" sc-camel-on-input=\"{{ onMetaInput }}\" placeholder=\"Add project\" style=\"font-size:14px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:4px 0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;min-width:150px\">\n          <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30)\">Director<\u002Fspan>\n          <input data-field=\"director\" sc-camel-default-value=\"{{ meta.director }}\" sc-camel-on-input=\"{{ onMetaInput }}\" placeholder=\"Add name\" style=\"font-size:14px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:4px 0\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:3px;min-width:110px\">\n          <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30)\">Date<\u002Fspan>\n          <input data-field=\"date\" sc-camel-default-value=\"{{ meta.date }}\" sc-camel-on-input=\"{{ onMetaInput }}\" placeholder=\"Add date\" style=\"font-size:14px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:4px 0\">\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"sl-toolbar\" data-noprint=\"\" style=\"position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--gray-15);padding:12px 32px\">\n    <!-- The count and the controls are one row that wraps, right-aligned, a\n         control at a time: with Size and Marker the buttons are wider than\n         1440px, and dropping them below the count as one block made this bar,\n         which stays pinned to the top of the window, three rows deep. -->\n    <div style=\"max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end\">\n      <div class=\"sl-toolbar-count\" style=\"font-family:var(--font-mono);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-40);font-weight:500;margin-right:auto\">{{ shotCount }} Shots<\u002Fdiv>\n\n      <div class=\"sl-toolbar-controls\" style=\"display:contents\">\n        <div style=\"display:flex;align-items:center;gap:8px\">\n          <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30)\">Layout<\u002Fspan>\n          <div style=\"display:flex;border:1px solid var(--gray-15)\">\n            <sc-for list=\"{{ layouts }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <button data-key=\"{{ opt.key }}\" sc-camel-on-click=\"{{ setLayoutEvt }}\" title=\"{{ opt.label }}\" style=\"{{ opt.style }}\">\n                <svg width=\"17\" height=\"17\"><use href=\"{{ opt.icon }}\"><\u002Fuse><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showGridSize }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"sl-gridsize sl-edit-only\" style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30)\">Size<\u002Fspan>\n            <div style=\"display:flex;border:1px solid var(--gray-15)\">\n              <sc-for list=\"{{ gridSizes }}\" as=\"gs\" hint-placeholder-count=\"3\">\n                <button data-key=\"{{ gs.key }}\" sc-camel-on-click=\"{{ setGridSizeEvt }}\" title=\"{{ gs.label }}\" style=\"{{ gs.style }}\">{{ gs.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ libraryEnabled }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-if value=\"{{ hasSyncStatus }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-30)\">{{ syncStatus }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasLibraryStatus }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-40)\">{{ libraryStatus }}<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ canShare }}\" hint-placeholder-val=\"{{ true }}\">\n            <button class=\"sl-share-btn\" sc-camel-on-click=\"{{ openShare }}\" title=\"Choose who can view or edit this storyboard\" style=\"{{ shareBtnStyle }}\" style-hover=\"opacity:0.88\">\n              <svg width=\"16\" height=\"16\"><use href=\"#ui-user\"><\u002Fuse><\u002Fsvg>{{ shareBtnLabel }}\n            <\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasSharedByLine }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-40);border:1px solid var(--gray-15);padding:9px 10px\">{{ sharedByLine }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showCommentsBtn }}\" hint-placeholder-val=\"{{ true }}\">\n          <button class=\"sl-comments-toggle sl-tb-phonehide\" sc-camel-on-click=\"{{ openComments }}\" title=\"Comments on this storyboard\" style=\"{{ commentsBtnStyle }}\" style-hover=\"border-color:var(--black)\">\n            <svg width=\"16\" height=\"16\"><use href=\"#ui-comment\"><\u002Fuse><\u002Fsvg>{{ commentsBtnLabel }}\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        \n        <div class=\"sl-edit-only sl-tb-phonehide\" style=\"position:relative\">\n          <button sc-camel-on-click=\"{{ toggleOrganizeMenu }}\" title=\"Group shots by a field\" style=\"{{ organizeBtnStyle }}\">\n            <svg width=\"16\" height=\"16\"><use href=\"#ui-grid\"><\u002Fuse><\u002Fsvg>{{ organizeLabel }}\n            <svg width=\"14\" height=\"14\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n          <\u002Fbutton>\n          <sc-if value=\"{{ organizeMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n            <div data-noprint=\"\" sc-camel-on-click=\"{{ closeOrganizeMenu }}\" style=\"position:fixed;inset:0;z-index:40\"><\u002Fdiv>\n            <div data-noprint=\"\" style=\"position:absolute;top:40px;left:0;width:180px;background:var(--white);border:1px solid var(--gray-15);box-shadow:var(--shadow-2);padding:6px;z-index:41;display:flex;flex-direction:column;gap:2px\">\n              <sc-if value=\"{{ isOrganized }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ restoreOrder }}\" style=\"padding:8px 10px;border:none;background:var(--white);cursor:pointer;text-align:left;font-size:13px;font-weight:700;color:var(--red-500)\" style-hover=\"background:var(--gray-5)\">Restore Order<\u002Fbutton>\n                <div style=\"height:1px;background:var(--gray-10);margin:2px 0\"><\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-for list=\"{{ organizeOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n                <button data-key=\"{{ o.key }}\" sc-camel-on-click=\"{{ chooseOrganize }}\" style=\"{{ o.style }}\" style-hover=\"background:var(--gray-5)\">\n                  <span style=\"{{ o.badgeStyle }}\">{{ o.badgeLabel }}<\u002Fspan>{{ o.label }}\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <button class=\"sl-edit-only sl-tb-phonehide\" sc-camel-on-click=\"{{ clearAll }}\" style=\"height:36px;padding:0 12px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-30);font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"color:var(--red-500);border-color:var(--red-500)\">Clear<\u002Fbutton>\n        <!-- Add Shot and Marker wrap together. -->\n        <div class=\"sl-addpair sl-edit-only sl-tb-phonehide\" style=\"display:flex;align-items:center;gap:16px\">\n          <button class=\"sl-edit-only\" sc-camel-on-click=\"{{ addFrame }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">\n            <svg width=\"18\" height=\"18\" style=\"stroke: #FFFFFF; fill: #FFFFFF; stroke-width: 4px\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>Add Shot\n          <\u002Fbutton>\n          <!-- Dark on light, light on dark: var(--white) turns over with the theme\n               as var(--black) does, so the label always reads. -->\n          <button class=\"sl-edit-only\" sc-camel-on-click=\"{{ addMarker }}\" title=\"Insert a compact schedule marker\" style=\"display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;background:var(--black);border:none;color:var(--white);font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em\" style-hover=\"opacity:0.85\">\n            <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--cglp-blue)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--cglp-blue)\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>Marker\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Phones: the board's main actions in a bar along the bottom, in reach\n       of a thumb, and the rest under More, in a sheet that rises from it.\n       Hidden on wider screens, where the toolbar above has them all. -->\n  <nav class=\"sl-phonebar\" data-noprint=\"\" aria-label=\"Board actions\" style=\"display:none\">\n    <button class=\"sl-phonebar-add sl-edit-only\" sc-camel-on-click=\"{{ addShotFromBar }}\">\n      <svg width=\"20\" height=\"20\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg><span>Add shot<\u002Fspan>\n    <\u002Fbutton>\n    <sc-if value=\"{{ showOnsetBtn }}\" hint-placeholder-val=\"{{ true }}\">\n      <button sc-camel-on-click=\"{{ openOnset }}\" title=\"One shot at a time for the shoot day\">\n        <svg width=\"20\" height=\"20\"><use href=\"#ui-clipboard\"><\u002Fuse><\u002Fsvg><span>On set<\u002Fspan>\n        <sc-if value=\"{{ hasPhoneOnsetBadge }}\" hint-placeholder-val=\"{{ false }}\"><b>{{ phoneOnsetBadge }}<\u002Fb><\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ showCommentsBtn }}\" hint-placeholder-val=\"{{ true }}\">\n      <button sc-camel-on-click=\"{{ openComments }}\" title=\"Comments on this storyboard\">\n        <svg width=\"20\" height=\"20\"><use href=\"#ui-comment\"><\u002Fuse><\u002Fsvg><span>Comments<\u002Fspan>\n        <sc-if value=\"{{ hasPhoneCommentsBadge }}\" hint-placeholder-val=\"{{ false }}\"><b>{{ phoneCommentsBadge }}<\u002Fb><\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fsc-if>\n    <button sc-camel-on-click=\"{{ togglePhoneMore }}\" aria-expanded=\"{{ phoneMoreStr }}\" aria-haspopup=\"dialog\">\n      <svg width=\"20\" height=\"20\"><use href=\"#ui-menu\"><\u002Fuse><\u002Fsvg><span>More<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fnav>\n  <sc-if value=\"{{ phoneMoreOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-noprint=\"\" sc-camel-on-click=\"{{ closePhoneMore }}\" style=\"position:fixed;inset:0;z-index:45;background:rgba(0,0,0,0.45)\"><\u002Fdiv>\n    <div class=\"sl-phonesheet\" data-noprint=\"\" role=\"dialog\" aria-label=\"More\" style=\"position:fixed;left:0;right:0;bottom:0;z-index:46;max-height:85vh;overflow:auto;background:var(--white);border-top:1px solid var(--gray-15);box-shadow:var(--shadow-2);padding:6px 16px calc(14px + env(safe-area-inset-bottom));color:var(--black);animation:cgpop .18s ease both\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 0 6px\">\n        <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray-30)\">More<\u002Fspan>\n        <button sc-camel-on-click=\"{{ closePhoneMore }}\" title=\"Close\" aria-label=\"Close\" style=\"width:40px;height:40px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer\">\n          <svg width=\"15\" height=\"15\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"sl-sheet-item sl-edit-only\" data-act=\"marker\" sc-camel-on-click=\"{{ phoneAct }}\"><svg width=\"18\" height=\"18\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>Add a schedule marker<\u002Fbutton>\n      <button class=\"sl-sheet-item\" data-act=\"print\" sc-camel-on-click=\"{{ phoneAct }}\"><svg width=\"18\" height=\"18\"><use href=\"#ui-print\"><\u002Fuse><\u002Fsvg>Print<\u002Fbutton>\n      <button class=\"sl-sheet-item\" data-act=\"pdf\" sc-camel-on-click=\"{{ phoneAct }}\"><svg width=\"18\" height=\"18\"><use href=\"#ui-pdf\"><\u002Fuse><\u002Fsvg>Export a PDF<\u002Fbutton>\n      <button class=\"sl-sheet-item\" data-act=\"project\" sc-camel-on-click=\"{{ phoneAct }}\"><svg width=\"18\" height=\"18\"><use href=\"#ui-copy\"><\u002Fuse><\u002Fsvg>Export the project<\u002Fbutton>\n      <label class=\"sl-sheet-item sl-edit-only\"><svg width=\"18\" height=\"18\"><use href=\"#ui-image\"><\u002Fuse><\u002Fsvg>Import a project\n        <input type=\"file\" accept=\"application/json\" sc-camel-on-change=\"{{ phoneImport }}\" style=\"display:none\">\n      <\u002Flabel>\n      <div class=\"sl-edit-only\" style=\"padding-top:14px\">\n        <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30);margin-bottom:8px\">Organize: group shots by<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n          <sc-for list=\"{{ organizeOptions }}\" as=\"o\" hint-placeholder-count=\"6\">\n            <button class=\"sl-sheet-chip\" data-key=\"{{ o.key }}\" data-on=\"{{ o.onAttr }}\" sc-camel-on-click=\"{{ chooseOrganize }}\">\n              <span style=\"{{ o.badgeStyle }}\">{{ o.badgeLabel }}<\u002Fspan>{{ o.label }}\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isOrganized }}\" hint-placeholder-val=\"{{ false }}\">\n          <button class=\"sl-sheet-item\" sc-camel-on-click=\"{{ restoreOrder }}\" style=\"color:var(--red-500)\">Restore the order<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div class=\"sl-edit-only\" style=\"border-top:1px solid var(--gray-10);margin-top:14px\">\n        <button class=\"sl-sheet-item\" data-act=\"clear\" sc-camel-on-click=\"{{ phoneAct }}\" style=\"color:var(--red-500)\"><svg width=\"18\" height=\"18\"><use href=\"#ui-trash\"><\u002Fuse><\u002Fsvg>Clear the board<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <main class=\"sl-main\" style=\"flex:1;padding:28px 32px 64px\">\n    <div style=\"max-width:1440px;margin:0 auto\">\n\n      <sc-if value=\"{{ isViewOnly }}\" hint-placeholder-val=\"{{ false }}\">\n        <div data-noprint=\"\" style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--gray-15);border-left:4px solid var(--cglp-blue);background:var(--white);padding:12px 16px;margin-bottom:20px;font-size:14px;color:var(--gray-50)\">\n          <strong style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--black)\">{{ viewOnlyLabel }}<\u002Fstrong>\n          <span>{{ viewOnlyNote }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border:2px dashed var(--gray-20);background:var(--white);padding:64px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px\">\n          <svg width=\"46\" height=\"46\" style=\"color:var(--gray-20)\"><use href=\"#ui-image\"><\u002Fuse><\u002Fsvg>\n          <div>\n            <div style=\"font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:-0.01em;text-transform:uppercase;color:var(--black)\">Start your board<\u002Fdiv>\n            <div style=\"font-size:14px;color:var(--gray-30);margin-top:6px;max-width:420px\">Add a shot, then drag in a reference image, set the lens and camera move, and write the action and dialogue.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"sl-edit-only\" style=\"display:flex;gap:10px\">\n            <button sc-camel-on-click=\"{{ addFrame }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\"><svg width=\"18\" height=\"18\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>Add First Shot<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ addThree }}\" style=\"height:44px;padding:0 18px;background:transparent;border:1px solid var(--gray-20);color:var(--gray-50);font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"background:var(--gray-5)\">Add 3 Shots<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div class=\"cg-board\" data-layout=\"{{ boardLayout }}\" ref=\"{{ setBoardRef }}\" sc-camel-on-mouse-down=\"{{ onBoardMouseDown }}\" style=\"{{ containerStyle }}\">\n        <sc-if value=\"{{ marqueeOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div data-noprint=\"\" style=\"{{ marqueeStyle }}\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ frames }}\" as=\"f\" hint-placeholder-count=\"0\">\n          <sc-if value=\"{{ f.isMarker }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"sl-marker\" ref=\"{{ f.setRef }}\" data-id=\"{{ f.id }}\" style=\"{{ f.markerStyle }}\">\n              <span class=\"sl-edit-only\" data-id=\"{{ f.id }}\" data-grip=\"\" sc-camel-on-pointer-down=\"{{ onHandlePointerDown }}\" sc-camel-on-click=\"{{ onHandleClick }}\" title=\"Click to select — drag to move\" style=\"{{ f.markerHandleStyle }}\">\n                <svg width=\"15\" height=\"15\"><use href=\"#ui-drag\"><\u002Fuse><\u002Fsvg>\n              <\u002Fspan>\n              <input class=\"sl-marker-label\" data-id=\"{{ f.id }}\" data-field=\"label\" value=\"{{ f.label }}\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"SCHEDULE MARKER\" style=\"{{ f.markerLabelStyle }}\">\n              <!-- On touch screens and phones a marker also moves with these, like\n                   a shot; hidden where a mouse is available (see the hover rules). -->\n              <button class=\"sl-move sl-edit-only\" data-id=\"{{ f.id }}\" data-dir=\"-1\" data-noprint=\"\" sc-camel-on-click=\"{{ moveFrame }}\" sc-camel-disabled=\"{{ f.isFirst }}\" title=\"Move earlier\" aria-label=\"Move marker earlier\" style=\"{{ f.markerMoveUpStyle }}\">\n                <svg width=\"16\" height=\"16\" style=\"transform:rotate(180deg)\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n              <\u002Fbutton>\n              <button class=\"sl-move sl-edit-only\" data-id=\"{{ f.id }}\" data-dir=\"1\" data-noprint=\"\" sc-camel-on-click=\"{{ moveFrame }}\" sc-camel-disabled=\"{{ f.isLast }}\" title=\"Move later\" aria-label=\"Move marker later\" style=\"{{ f.markerMoveDownStyle }}\">\n                <svg width=\"16\" height=\"16\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n              <\u002Fbutton>\n              <button class=\"sl-edit-only\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ deleteFrame }}\" data-noprint=\"\" title=\"Delete marker\" style=\"{{ f.markerDeleteStyle }}\">\n                <!-- The colour is a style, not an attribute: the page's icon rule (svg[width]) would win over stroke=. -->\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--cglp-blue)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"stroke:var(--cglp-blue);stroke-width:5px\"><use href=\"#ui-close\" sc-camel-xlink-href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isLocationsCard }}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"cg-card sl-stripcard\" ref=\"{{ f.setRef }}\" data-id=\"{{ f.id }}\" style=\"{{ f.cardStyle }}\">\n              <sc-if value=\"{{ f.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"{{ f.tagStripStyle }}\"><\u002Fdiv><\u002Fsc-if>\n              <span class=\"sl-handle sl-edit-only\" data-id=\"{{ f.id }}\" data-grip=\"\" sc-camel-on-pointer-down=\"{{ onHandlePointerDown }}\" sc-camel-on-click=\"{{ onHandleClick }}\" title=\"Click to select (shift/cmd for multiple) — drag to move\" style=\"{{ f.sideHandleStyle }}\">\n                <svg width=\"16\" height=\"16\"><use href=\"#ui-drag\"><\u002Fuse><\u002Fsvg>\n              <\u002Fspan>\n              <!-- One row of fields; where the window is too narrow for it, the\n                   last of them go on to a second line rather than squeeze. -->\n              <div class=\"sl-striprow\" style=\"display:flex;align-items:center;flex-wrap:wrap;gap:12px 14px;padding:14px 16px;flex:1;min-width:0\">\n                <div style=\"font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--gray-30);flex:0 0 56px\">{{ f.badge }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:0 0 140px\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Shot Type<\u002Fspan>\n                  <sc-raw-select data-id=\"{{ f.id }}\" data-field=\"shotType\" value=\"{{ f.shotType }}\" sc-camel-on-change=\"{{ onFieldInput }}\" style=\"font-size:15px;font-weight:700;border:none;background:transparent;padding:3px 0;width:100%\">\n                    <option value=\"\">—<\u002Foption>\n                    <option value=\"Establishing\">Establishing<\u002Foption>\n                    <option value=\"Wide (WS)\">Wide (WS)<\u002Foption>\n                    <option value=\"Medium (MS)\">Medium (MS)<\u002Foption>\n                    <option value=\"Medium Close (MCU)\">Medium Close (MCU)<\u002Foption>\n                    <option value=\"Close-Up (CU)\">Close-Up (CU)<\u002Foption>\n                    <option value=\"Extreme Close-Up (ECU)\">Extreme Close-Up (ECU)<\u002Foption>\n                    <option value=\"Over-the-Shoulder (OTS)\">Over-the-Shoulder (OTS)<\u002Foption>\n                    <option value=\"Two-Shot\">Two-Shot<\u002Foption>\n                    <option value=\"POV\">POV<\u002Foption>\n                    <option value=\"Insert\">Insert<\u002Foption>\n                    <option value=\"Aerial\">Aerial<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:1 1 110px;min-width:0\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Subject<\u002Fspan>\n                  <input data-id=\"{{ f.id }}\" data-field=\"subject\" value=\"{{ f.subject }}\" sc-camel-on-input=\"{{ onFieldInput }}\" list=\"cg-subjects\" placeholder=\"Who/what is in frame\" style=\"font-size:15px;font-weight:700;border:none;background:transparent;padding:3px 0;width:100%\">\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:1 1 110px;min-width:0\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Location<\u002Fspan>\n                  <input data-id=\"{{ f.id }}\" data-field=\"location\" value=\"{{ f.location }}\" sc-camel-on-input=\"{{ onFieldInput }}\" list=\"cg-locations\" placeholder=\"Where it's shot\" style=\"font-size:15px;font-weight:700;border:none;background:transparent;padding:3px 0;width:100%\">\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:0 0 160px\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30)\">Time of Day<\u002Fspan>\n                  <sc-raw-select data-id=\"{{ f.id }}\" data-field=\"timeOfDay\" value=\"{{ f.timeOfDay }}\" sc-camel-on-change=\"{{ onFieldInput }}\" style=\"font-size:15px;font-weight:700;border:none;background:transparent;padding:3px 0;width:100%\">\n                    <option value=\"\">—<\u002Foption>\n                    <option value=\"Dawn\">Dawn<\u002Foption>\n                    <option value=\"Morning\">Morning<\u002Foption>\n                    <option value=\"Midday\">Midday<\u002Foption>\n                    <option value=\"Afternoon\">Afternoon<\u002Foption>\n                    <option value=\"Golden Hour\">Golden Hour<\u002Foption>\n                    <option value=\"Dusk\">Dusk<\u002Foption>\n                    <option value=\"Night\">Night<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:1 1 110px;min-width:0\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Notes<\u002Fspan>\n                  <input data-id=\"{{ f.id }}\" data-field=\"notes\" value=\"{{ f.notes }}\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Custom note\" style=\"font-size:15px;font-weight:700;border:none;background:transparent;padding:3px 0;width:100%\">\n                <\u002Fdiv>\n                <!-- The shot's own buttons, as on the other layouts' cards and with\n                     the same classes, so view only and the phone rules treat them\n                     alike: move (touch screens), comment, add after, duplicate,\n                     delete. -->\n                <div class=\"sl-cardfoot sl-stripfoot\" data-noprint=\"\" style=\"display:flex;align-items:center;gap:6px;margin-left:auto\">\n                  <button class=\"sl-move\" data-id=\"{{ f.id }}\" data-dir=\"-1\" sc-camel-on-click=\"{{ moveFrame }}\" sc-camel-disabled=\"{{ f.isFirst }}\" title=\"Move earlier\" aria-label=\"Move shot earlier\" style=\"{{ f.moveUpStyle }}\">\n                    <svg width=\"16\" height=\"16\" style=\"transform:rotate(180deg)\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fbutton>\n                  <button class=\"sl-move\" data-id=\"{{ f.id }}\" data-dir=\"1\" sc-camel-on-click=\"{{ moveFrame }}\" sc-camel-disabled=\"{{ f.isLast }}\" title=\"Move later\" aria-label=\"Move shot later\" style=\"{{ f.moveDownStyle }}\">\n                    <svg width=\"16\" height=\"16\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fbutton>\n                  <button class=\"sl-comment-btn\" data-show=\"{{ f.commentShow }}\" data-frame=\"{{ f.id }}\" sc-camel-on-click=\"{{ openComments }}\" title=\"{{ f.commentBtnTitle }}\" aria-label=\"{{ f.commentBtnTitle }}\" style=\"{{ f.commentBtnStyle }}\">\n                    <svg width=\"15\" height=\"15\"><use href=\"#ui-comment\"><\u002Fuse><\u002Fsvg>{{ f.commentBtnLabel }}\n                  <\u002Fbutton>\n                  <button class=\"sl-act sl-act-first\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ addShotAfter }}\" title=\"Add shot after\" style=\"width:30px;height:30px;background:transparent;border:1px solid var(--gray-15);color:var(--cglp-blue);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--gray-5)\">\n                    <svg width=\"22\" height=\"22\" stroke-width=\"4\" style=\"stroke: #56C4E5EB; fill: #56C4E5\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fbutton>\n                  <button class=\"sl-act\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ duplicateFrame }}\" title=\"Duplicate\" style=\"width:30px;height:30px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--gray-5)\">\n                    <svg width=\"16\" height=\"16\"><use href=\"#ui-copy\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fbutton>\n                  <button class=\"sl-act\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ deleteFrame }}\" title=\"Delete shot\" style=\"width:30px;height:30px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"color:var(--red-500);border-color:var(--red-500)\">\n                    <svg width=\"16\" height=\"16\"><use href=\"#ui-trash\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ f.isRegularCard }}\" hint-placeholder-val=\"{{ true }}\">\n          <div class=\"cg-card\" ref=\"{{ f.setRef }}\" data-id=\"{{ f.id }}\" style=\"{{ f.cardStyle }}\">\n            <sc-if value=\"{{ f.hasTag }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"{{ f.tagStripStyle }}\"><\u002Fdiv><\u002Fsc-if>\n\n            <sc-if value=\"{{ f.showSideHandle }}\" hint-placeholder-val=\"{{ true }}\">\n              <span class=\"sl-handle sl-edit-only\" data-id=\"{{ f.id }}\" data-grip=\"\" sc-camel-on-pointer-down=\"{{ onHandlePointerDown }}\" sc-camel-on-click=\"{{ onHandleClick }}\" title=\"Click to select (shift/cmd for multiple) — drag to move\" style=\"{{ f.sideHandleStyle }}\">\n                <svg width=\"16\" height=\"16\"><use href=\"#ui-drag\"><\u002Fuse><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ f.showImage }}\" hint-placeholder-val=\"{{ true }}\">\n            <div class=\"sl-imgwrap\" data-id=\"{{ f.id }}\" sc-camel-on-mouse-enter=\"{{ onImgHoverIn }}\" sc-camel-on-mouse-leave=\"{{ onImgHoverOut }}\" style=\"{{ f.wrapStyle }}\">\n              <sc-if value=\"{{ f.hasImage }}\" hint-placeholder-val=\"{{ false }}\">\n                <div data-id=\"{{ f.id }}\" sc-camel-on-pointer-down=\"{{ onImgPointerDown }}\" title=\"Drag to reposition\" style=\"position:absolute;inset:0;overflow:hidden;cursor:move;touch-action:none\">\n                  <img src=\"{{ f.image }}\" alt=\"\" draggable=\"{{ false }}\" style=\"width:100%;height:100%;object-fit:cover;object-position:{{ f.cropPos }};transform:scale({{ f.zoom }});transform-origin:{{ f.cropPos }};display:block;pointer-events:none;user-select:none\">\n                  <!-- A clip plays over its first frame; print and PDF show the frame. -->\n                  <sc-if value=\"{{ f.hasClip }}\" hint-placeholder-val=\"{{ false }}\">\n                    <video data-noprint=\"\" src=\"{{ f.clip }}\" ref=\"{{ setClipRef }}\" autoplay=\"\" loop=\"\" muted=\"\" playsinline=\"\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ f.cropPos }};transform:scale({{ f.zoom }});transform-origin:{{ f.cropPos }};display:block;pointer-events:none\"><\u002Fvideo>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ f.noImage }}\" hint-placeholder-val=\"{{ true }}\">\n                <!-- A click asks where the picture comes from (openSlotMenu); a\n                     file dropped on it goes straight in. -->\n                <div role=\"button\" tabindex=\"0\" aria-haspopup=\"menu\" title=\"Add a picture\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ openSlotMenu }}\" sc-camel-on-key-down=\"{{ onSlotKey }}\" sc-camel-on-drag-over=\"{{ onImgDragOver }}\" sc-camel-on-drag-leave=\"{{ onImgDragLeave }}\" sc-camel-on-drop=\"{{ onImgDrop }}\" style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden\">\n                  <input type=\"file\" accept=\"image/*\" data-id=\"{{ f.id }}\" data-slot=\"{{ f.id }}\" sc-camel-on-change=\"{{ onImgPick }}\" style=\"display:none\">\n                  <span style=\"display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--gray-20);pointer-events:none\">\n                    \n                    <span style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase\">Drag image or click<\u002Fspan>\n                  <\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"position:absolute;top:8px;left:8px;background:var(--black);font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.06em;padding:3px 7px;pointer-events:none;color:{{ f.accent }}\">{{ f.badge }}<\u002Fdiv>\n              <sc-if value=\"{{ f.hasOnset }}\" hint-placeholder-val=\"{{ false }}\">\n                <div title=\"{{ f.onsetTitle }}\" style=\"{{ f.onsetChipStyle }}\">{{ f.onsetLabel }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ f.hasMove }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"position:absolute;bottom:8px;left:8px;display:flex;align-items:center;gap:6px;pointer-events:none;color:{{ f.accent }}\">\n                  <svg width=\"17\" height=\"17\" style=\"color: var(--cglp-blue); fill: #56C4E4; background-color: #54545400\"><use href=\"{{ f.iconHref }}\"><\u002Fuse><\u002Fsvg>\n                  <span style=\"font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; background-color: #54545400\">{{ f.moveLabel }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ f.hasImage }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"sl-imgtools\" data-noprint=\"\" style=\"{{ f.toolbarStyle }}\">\n                  <input type=\"range\" min=\"1\" max=\"3\" step=\"0.01\" value=\"{{ f.zoom }}\" data-id=\"{{ f.id }}\" sc-camel-on-input=\"{{ onZoom }}\" title=\"Zoom\" style=\"accent-color: var(--cglp-blue); cursor: pointer; width: 70px; position: sticky; padding-left: 0px; padding-right: 0px\">\n                  <button data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ openAspectMenu }}\" title=\"Aspect ratio\" style=\"height:26px;padding:0 8px;background:rgba(0,0,0,0.55);border:none;color:#fff;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:0.04em;cursor:pointer\">{{ f.aspectLabel }}<\u002Fbutton>\n                  <!-- Replace asks where from, as an empty picture does. -->\n                  <input type=\"file\" accept=\"image/*\" data-id=\"{{ f.id }}\" data-slot=\"{{ f.id }}\" sc-camel-on-change=\"{{ onImgPick }}\" style=\"display:none\">\n                  <button data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ openSlotMenu }}\" title=\"Replace image\" aria-haspopup=\"menu\" style=\"width:26px;height:26px;background:rgba(0,0,0,0.55);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\">\n                    <svg width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><use href=\"#ui-image\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fbutton>\n                  <button data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ removeImage }}\" title=\"Remove image\" style=\"width:26px;height:26px;background:rgba(0,0,0,0.55);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center\">\n                    <svg width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div class=\"sl-fields\" style=\"{{ fieldsStyle }}\">\n              <div class=\"sl-fieldrow\" style=\"display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap\">\n                <div class=\"sl-numbox\" style=\"{{ f.numBoxStyle }}\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Scene<\u002Fspan>\n                  <input class=\"sl-big\" data-id=\"{{ f.id }}\" data-field=\"scene\" data-print-hint=\"\" value=\"{{ f.scene }}\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"1\" style=\"font-family:var(--font-display);font-weight:900;font-size:18px;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:2px 0;width:100%\">\n                <\u002Fdiv>\n                <div class=\"sl-numbox\" style=\"{{ f.numBoxStyle }}\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Shot<\u002Fspan>\n                  <input class=\"sl-big\" value=\"{{ f.shotNum }}\" sc-camel-read-only=\"{{ true }}\" style=\"font-family:var(--font-display);font-weight:900;font-size:18px;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:2px 0;width:100%\">\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:70px\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Shot Type<\u002Fspan>\n                  <sc-raw-select data-id=\"{{ f.id }}\" data-field=\"shotType\" value=\"{{ f.shotType }}\" sc-camel-on-change=\"{{ onFieldInput }}\" style=\"font-size:13px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:3px 0;width:100%\">\n                    <option value=\"\">—<\u002Foption>\n                    <option value=\"Establishing\">Establishing<\u002Foption>\n                    <option value=\"Wide (WS)\">Wide (WS)<\u002Foption>\n                    <option value=\"Medium (MS)\">Medium (MS)<\u002Foption>\n                    <option value=\"Medium Close (MCU)\">Medium Close (MCU)<\u002Foption>\n                    <option value=\"Close-Up (CU)\">Close-Up (CU)<\u002Foption>\n                    <option value=\"Extreme Close-Up (ECU)\">Extreme Close-Up (ECU)<\u002Foption>\n                    <option value=\"Over-the-Shoulder (OTS)\">Over-the-Shoulder (OTS)<\u002Foption>\n                    <option value=\"Two-Shot\">Two-Shot<\u002Foption>\n                    <option value=\"POV\">POV<\u002Foption>\n                    <option value=\"Insert\">Insert<\u002Foption>\n                    <option value=\"Aerial\">Aerial<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div style=\"{{ f.lensBoxStyle }}\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Lens<\u002Fspan>\n                  <sc-raw-select data-id=\"{{ f.id }}\" data-field=\"lens\" value=\"{{ f.lens }}\" sc-camel-on-change=\"{{ onFieldInput }}\" style=\"font-size:13px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:3px 0;width:100%\">\n                    <option value=\"\">—<\u002Foption>\n                    <option value=\"14mm\">14mm<\u002Foption>\n                    <option value=\"18mm\">18mm<\u002Foption>\n                    <option value=\"24mm\">24mm<\u002Foption>\n                    <option value=\"35mm\">35mm<\u002Foption>\n                    <option value=\"50mm\">50mm<\u002Foption>\n                    <option value=\"75mm\">75mm<\u002Foption>\n                    <option value=\"85mm\">85mm<\u002Foption>\n                    <option value=\"100mm\">100mm<\u002Foption>\n                    <option value=\"135mm\">135mm<\u002Foption>\n                    <option value=\"Zoom\">Zoom<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <sc-if value=\"{{ f.camInline }}\" hint-placeholder-val=\"{{ false }}\">\n                <div class=\"sl-caminline\" style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:0\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30)\">Camera Move<\u002Fspan>\n                  <button data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ openCamMenu }}\" data-noprint=\"\" style=\"display:flex;align-items:center;gap:6px;border:1px solid var(--gray-15);background:var(--white);padding:5px 7px;cursor:pointer;text-align:left\" style-hover=\"background:var(--gray-5)\">\n                    <svg width=\"16\" height=\"16\" style=\"flex:0 0 auto;color:var(--cglp-blue)\"><use href=\"{{ f.iconHref }}\"><\u002Fuse><\u002Fsvg>\n                    <span style=\"font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ f.moveLabel }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ f.camStandalone }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30)\">Camera Move<\u002Fspan>\n                <button data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ openCamMenu }}\" data-noprint=\"\" style=\"display:flex;align-items:center;gap:9px;border:1px solid var(--gray-15);background:var(--white);padding:7px 9px;cursor:pointer;text-align:left\" style-hover=\"background:var(--gray-5)\">\n                  <svg width=\"20\" height=\"20\" style=\"flex:0 0 auto;color:var(--cglp-blue)\"><use href=\"{{ f.iconHref }}\"><\u002Fuse><\u002Fsvg>\n                  <span style=\"font-size:13px;font-weight:700;flex:1\">{{ f.moveLabel }}<\u002Fspan>\n                  <svg width=\"16\" height=\"16\" style=\"color:var(--gray-30)\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div class=\"sl-subjrow\" style=\"display:flex;gap:10px\">\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:0\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Subject<\u002Fspan>\n                  <input data-id=\"{{ f.id }}\" data-field=\"subject\" value=\"{{ f.subject }}\" sc-camel-on-input=\"{{ onFieldInput }}\" list=\"cg-subjects\" placeholder=\"Who/what is in frame\" style=\"font-size:13px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:3px 0;width:100%\">\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:0\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Location<\u002Fspan>\n                  <input data-id=\"{{ f.id }}\" data-field=\"location\" value=\"{{ f.location }}\" sc-camel-on-input=\"{{ onFieldInput }}\" list=\"cg-locations\" placeholder=\"Where it's shot\" style=\"font-size:13px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:3px 0;width:100%\">\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:0 0 110px\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30)\">Time of Day<\u002Fspan>\n                  <sc-raw-select data-id=\"{{ f.id }}\" data-field=\"timeOfDay\" value=\"{{ f.timeOfDay }}\" sc-camel-on-change=\"{{ onFieldInput }}\" style=\"font-size:13px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:3px 0;width:100%\">\n                    <option value=\"\">—<\u002Foption>\n                    <option value=\"Dawn\">Dawn<\u002Foption>\n                    <option value=\"Morning\">Morning<\u002Foption>\n                    <option value=\"Midday\">Midday<\u002Foption>\n                    <option value=\"Afternoon\">Afternoon<\u002Foption>\n                    <option value=\"Golden Hour\">Golden Hour<\u002Foption>\n                    <option value=\"Dusk\">Dusk<\u002Foption>\n                    <option value=\"Night\">Night<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <sc-if value=\"{{ f.camInline }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:0\">\n                  <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">Notes<\u002Fspan>\n                  <input data-id=\"{{ f.id }}\" data-field=\"notes\" value=\"{{ f.notes }}\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Custom note\" style=\"font-size:13px;font-weight:700;border:none;border-bottom:1px solid var(--gray-15);background:transparent;padding:3px 0;width:100%\">\n                <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div class=\"sl-descdlg\" style=\"{{ f.descDialogueWrapStyle }}\">\n              <div style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:0\">\n                <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30)\">Action / Description<\u002Fspan>\n                <textarea data-id=\"{{ f.id }}\" data-field=\"description\" value=\"{{ f.description }}\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"What happens in this shot…\" style=\"font-size:13px;line-height:1.45;color:var(--gray-60);border:1px solid var(--gray-15);background:var(--gray-2);padding:8px;width:100%;resize:vertical;min-height:52px\"><\u002Ftextarea>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:2px;flex:1;min-width:0\">\n                <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30)\">Dialogue / VO<\u002Fspan>\n                <textarea data-id=\"{{ f.id }}\" data-field=\"dialogue\" value=\"{{ f.dialogue }}\" sc-camel-on-input=\"{{ onFieldInput }}\" placeholder=\"Spoken lines or voiceover…\" style=\"font-size:13px;line-height:1.45;font-style:italic;color:var(--gray-60);border:1px solid var(--gray-15);background:var(--gray-2);padding:8px;width:100%;resize:vertical;min-height:44px\"><\u002Ftextarea>\n              <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div class=\"sl-cardfoot\" data-noprint=\"\" style=\"{{ f.footerStyle }}\">\n                <!-- Grid only; List and AV have the handle down the card's left side. -->\n                <sc-if value=\"{{ f.showFooterHandle }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span class=\"sl-handle\" data-id=\"{{ f.id }}\" data-grip=\"\" sc-camel-on-pointer-down=\"{{ onHandlePointerDown }}\" sc-camel-on-click=\"{{ onHandleClick }}\" title=\"Click to select (shift/cmd for multiple) — drag to move\" style=\"{{ f.handleStyle }}\">\n                    <svg width=\"16\" height=\"16\"><use href=\"#ui-drag\"><\u002Fuse><\u002Fsvg>\n                  <\u002Fspan>\n                <\u002Fsc-if>\n                <!-- Touch screens and phones get these as well as the handle;\n                     hidden where a mouse is available (see the hover rules). -->\n                <button class=\"sl-move\" data-id=\"{{ f.id }}\" data-dir=\"-1\" sc-camel-on-click=\"{{ moveFrame }}\" sc-camel-disabled=\"{{ f.isFirst }}\" title=\"Move earlier\" aria-label=\"Move shot earlier\" style=\"{{ f.moveUpStyle }}\">\n                  <svg width=\"16\" height=\"16\" style=\"transform:rotate(180deg)\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n                <\u002Fbutton>\n                <button class=\"sl-move\" data-id=\"{{ f.id }}\" data-dir=\"1\" sc-camel-on-click=\"{{ moveFrame }}\" sc-camel-disabled=\"{{ f.isLast }}\" title=\"Move later\" aria-label=\"Move shot later\" style=\"{{ f.moveDownStyle }}\">\n                  <svg width=\"16\" height=\"16\"><use href=\"#ui-caret\"><\u002Fuse><\u002Fsvg>\n                <\u002Fbutton>\n                <!-- Stays when the rest of this row is hidden (view and comment only). -->\n                <button class=\"sl-comment-btn\" data-show=\"{{ f.commentShow }}\" data-frame=\"{{ f.id }}\" sc-camel-on-click=\"{{ openComments }}\" title=\"{{ f.commentBtnTitle }}\" aria-label=\"{{ f.commentBtnTitle }}\" style=\"{{ f.commentBtnStyle }}\">\n                  <svg width=\"15\" height=\"15\"><use href=\"#ui-comment\"><\u002Fuse><\u002Fsvg>{{ f.commentBtnLabel }}\n                <\u002Fbutton>\n                <div class=\"sl-tags\" style=\"margin-left:auto;display:flex;align-items:center;gap:6px\">\n                  <sc-for list=\"{{ f.tags }}\" as=\"t\" hint-placeholder-count=\"5\">\n                    <button data-id=\"{{ f.id }}\" data-key=\"{{ t.key }}\" sc-camel-on-click=\"{{ chooseTagEvt }}\" title=\"{{ t.label }}\" style=\"{{ t.style }}\"><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button class=\"sl-act sl-act-first\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ addShotAfter }}\" title=\"Add shot after\" style=\"width:30px;height:30px;background:transparent;border:1px solid var(--gray-15);color:var(--cglp-blue);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--gray-5)\">\n                  <svg width=\"22\" height=\"22\" stroke-width=\"4\" style=\"stroke: #56C4E5EB; fill: #56C4E5\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>\n                <\u002Fbutton>\n                <button class=\"sl-act\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ duplicateFrame }}\" title=\"Duplicate\" style=\"width:30px;height:30px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:var(--gray-5)\">\n                  <svg width=\"16\" height=\"16\"><use href=\"#ui-copy\"><\u002Fuse><\u002Fsvg>\n                <\u002Fbutton>\n                <button class=\"sl-act\" data-id=\"{{ f.id }}\" sc-camel-on-click=\"{{ deleteFrame }}\" title=\"Delete shot\" style=\"width:30px;height:30px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"color:var(--red-500);border-color:var(--red-500)\">\n                  <svg width=\"16\" height=\"16\"><use href=\"#ui-trash\"><\u002Fuse><\u002Fsvg>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasFrames }}\" hint-placeholder-val=\"{{ false }}\">\n        <button class=\"sl-edit-only\" data-noprint=\"\" sc-camel-on-click=\"{{ addFrame }}\" style=\"margin-top:22px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:280px;height:48px;background:transparent;border:2px dashed var(--gray-20);color:var(--gray-40);font-size:13px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.05em\" style-hover=\"border-color:var(--black);color:var(--black)\">\n          <svg width=\"18\" height=\"18\"><use href=\"#ui-plus\"><\u002Fuse><\u002Fsvg>Add Shot\n        <\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <datalist id=\"cg-subjects\">\n    <sc-for list=\"{{ subjectOptions }}\" as=\"s\" hint-placeholder-count=\"0\">\n      <option value=\"{{ s }}\"><\u002Foption>\n    <\u002Fsc-for>\n  <\u002Fdatalist>\n\n  <datalist id=\"cg-locations\">\n    <sc-for list=\"{{ locationOptions }}\" as=\"l\" hint-placeholder-count=\"0\">\n      <option value=\"{{ l }}\"><\u002Foption>\n    <\u002Fsc-for>\n  <\u002Fdatalist>\n\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ aspectMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" sc-camel-on-click=\"{{ closeAspectMenu }}\" style=\"position:fixed;inset:0;z-index:40\"><\u002Fdiv>\n  <div data-noprint=\"\" style=\"{{ aspectMenuStyle }}\">\n    <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);padding:2px 4px 8px\">Aspect Ratio<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <sc-for list=\"{{ aspects }}\" as=\"a\" hint-placeholder-count=\"5\">\n        <button data-key=\"{{ a.key }}\" sc-camel-on-click=\"{{ chooseAspectEvt }}\" style=\"{{ a.menuStyle }}\" style-hover=\"background:var(--gray-5)\">{{ a.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ slotMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" sc-camel-on-click=\"{{ closeSlotMenu }}\" style=\"position:fixed;inset:0;z-index:40\"><\u002Fdiv>\n  <div data-noprint=\"\" role=\"menu\" aria-label=\"{{ slotMenuTitle }}\" style=\"{{ slotMenuStyle }}\">\n    <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);padding:2px 4px 8px\">{{ slotMenuTitle }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:2px\">\n      <button role=\"menuitem\" data-id=\"{{ slotMenuFor }}\" sc-camel-on-click=\"{{ openShotDeck }}\" style=\"padding:8px 10px;border:none;background:var(--white);color:var(--black);cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px\" style-hover=\"background:var(--gray-5)\">\n        <svg width=\"15\" height=\"15\"><use href=\"#ui-grid\"><\u002Fuse><\u002Fsvg>From ShotDeck\n      <\u002Fbutton>\n      <button role=\"menuitem\" data-id=\"{{ slotMenuFor }}\" data-source=\"frameset\" sc-camel-on-click=\"{{ openShotDeck }}\" style=\"padding:8px 10px;border:none;background:var(--white);color:var(--black);cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px\" style-hover=\"background:var(--gray-5)\">\n        <svg width=\"15\" height=\"15\"><use href=\"#ui-strip\"><\u002Fuse><\u002Fsvg>From FrameSet\n      <\u002Fbutton>\n      <button role=\"menuitem\" data-id=\"{{ slotMenuFor }}\" sc-camel-on-click=\"{{ slotFromComputer }}\" style=\"padding:8px 10px;border:none;background:var(--white);color:var(--black);cursor:pointer;text-align:left;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px\" style-hover=\"background:var(--gray-5)\">\n        <svg width=\"15\" height=\"15\"><use href=\"#ui-image\"><\u002Fuse><\u002Fsvg>From this computer\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ camMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-noprint=\"\" sc-camel-on-click=\"{{ closeCamMenu }}\" style=\"position:fixed;inset:0;z-index:40\"><\u002Fdiv>\n  <div data-noprint=\"\" style=\"{{ camMenuStyle }}\">\n    <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--gray-30);padding:2px 4px 8px\">Camera Move<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:4px\">\n      <sc-for list=\"{{ moves }}\" as=\"m\" hint-placeholder-count=\"14\">\n        <button data-key=\"{{ m.key }}\" sc-camel-on-click=\"{{ chooseMoveEvt }}\" style=\"{{ m.style }}\" style-hover=\"background:var(--gray-5)\">\n          <svg width=\"22\" height=\"22\" style=\"color:var(--cglp-blue)\"><use href=\"{{ m.href }}\"><\u002Fuse><\u002Fsvg>\n          <span style=\"font-family:var(--font-mono);font-size:9px;letter-spacing:0.02em;text-transform:uppercase;color:var(--gray-40);text-align:center;line-height:1.1\">{{ m.label }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- Share: who can view or edit this storyboard, like a shared document. -->\n<sc-if value=\"{{ shareOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"sl-share-wrap\" data-noprint=\"\" sc-camel-on-click=\"{{ closeShare }}\" style=\"position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px;overflow:auto\">\n    <div class=\"sl-share-card\" role=\"dialog\" aria-label=\"Share\" sc-camel-on-click=\"{{ stopShareClick }}\" style=\"width:520px;max-width:100%;background:var(--white);border:1px solid var(--gray-15);box-shadow:var(--shadow-2);padding:24px;display:flex;flex-direction:column;gap:18px;color:var(--black)\">\n      <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n        <div style=\"min-width:0\">\n          <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gray-30);margin-bottom:6px\">Share<\u002Fdiv>\n          <div style=\"font-family:var(--font-display);font-weight:900;font-size:24px;line-height:1;letter-spacing:-0.01em;text-transform:uppercase;overflow-wrap:anywhere\">{{ shareTitle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ closeShare }}\" title=\"Close\" aria-label=\"Close\" style=\"width:32px;height:32px;flex:0 0 32px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\" style-hover=\"border-color:var(--black);color:var(--black)\">\n          <svg width=\"15\" height=\"15\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ shareLoading }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:14px;color:var(--gray-40)\">Loading…<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasShareRequests }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid var(--cglp-blue);padding:4px 14px\">\n          <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30);padding:8px 0 2px\">Asking for access<\u002Fdiv>\n          <sc-for list=\"{{ shareRequests }}\" as=\"q\" hint-placeholder-count=\"0\">\n            <div class=\"sl-share-request\" style=\"display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--gray-10);flex-wrap:wrap\">\n              <sc-if value=\"{{ q.photoShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ q.photoClass }}\" src=\"{{ q.photoUrl }}\" width=\"{{ q.photoPx }}\" height=\"{{ q.photoPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ q.photoLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ q.photoClass }}\" aria-hidden=\"true\">{{ q.photoLetters }}<\u002Fspan><\u002Fsc-if>\n              <span style=\"flex:1 1 150px;min-width:0\">\n                <span style=\"display:block;font-size:14px;font-weight:700\">{{ q.name }}<\u002Fspan>\n                <span style=\"display:block;font-family:var(--font-mono);font-size:11px;color:var(--gray-30)\">{{ q.sub }}<\u002Fspan>\n              <\u002Fspan>\n              <button data-id=\"{{ q.id }}\" data-level=\"{{ q.first }}\" sc-camel-on-click=\"{{ shareAllow }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">{{ q.firstLabel }}<\u002Fbutton>\n              <button data-id=\"{{ q.id }}\" data-level=\"{{ q.second }}\" sc-camel-on-click=\"{{ shareAllow }}\" style=\"height:36px;padding:0 10px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-50);font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"border-color:var(--black);color:var(--black)\">{{ q.secondLabel }}<\u002Fbutton>\n              <button data-id=\"{{ q.id }}\" sc-camel-on-click=\"{{ shareDecline }}\" style=\"height:36px;padding:0 10px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"color:var(--red-500);border-color:var(--red-500)\">Decline<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ shareReady }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <input class=\"sl-share-search\" value=\"{{ shareQuery }}\" sc-camel-on-input=\"{{ onShareQuery }}\" placeholder=\"Add people by name\" autocomplete=\"off\" style=\"font-size:15px;font-weight:600;border:1px solid var(--gray-20);background:var(--white);padding:10px 12px;width:100%\">\n          <sc-if value=\"{{ hasShareMatches }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid var(--gray-15);display:flex;flex-direction:column\">\n              <sc-for list=\"{{ shareMatches }}\" as=\"p\" hint-placeholder-count=\"0\">\n                <button data-id=\"{{ p.id }}\" sc-camel-on-click=\"{{ shareAdd }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:none;border-bottom:1px solid var(--gray-10);background:var(--white);cursor:pointer;text-align:left\" style-hover=\"background:var(--gray-5)\">\n                  <sc-if value=\"{{ p.photoShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ p.photoClass }}\" src=\"{{ p.photoUrl }}\" width=\"{{ p.photoPx }}\" height=\"{{ p.photoPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ p.photoLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ p.photoClass }}\" aria-hidden=\"true\">{{ p.photoLetters }}<\u002Fspan><\u002Fsc-if>\n                  <span style=\"flex:1;min-width:0\">\n                    <span style=\"display:block;font-size:14px;font-weight:700\">{{ p.name }}<\u002Fspan>\n                    <span style=\"display:block;font-family:var(--font-mono);font-size:11px;color:var(--gray-30)\">{{ p.sub }}<\u002Fspan>\n                  <\u002Fspan>\n                  <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--cglp-blue);white-space:nowrap\">+ Add<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ shareNoMatches }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:var(--gray-30)\">Nobody on the team by that name.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30);margin-bottom:6px\">People with access<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-10)\">\n            <sc-if value=\"{{ ownerPhotoShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ ownerPhotoClass }}\" src=\"{{ ownerPhotoUrl }}\" width=\"{{ ownerPhotoPx }}\" height=\"{{ ownerPhotoPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ ownerPhotoLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ ownerPhotoClass }}\" aria-hidden=\"true\">{{ ownerPhotoLetters }}<\u002Fspan><\u002Fsc-if>\n            <span style=\"flex:1;min-width:0;font-size:14px;font-weight:700\">{{ shareOwnerName }}<\u002Fspan>\n            <span style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--gray-30)\">Owner<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ shareRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n            <div class=\"sl-share-row\" style=\"display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--gray-10);flex-wrap:wrap\">\n              <sc-if value=\"{{ r.photoShown }}\" hint-placeholder-val=\"{{ false }}\"><img class=\"{{ r.photoClass }}\" src=\"{{ r.photoUrl }}\" width=\"{{ r.photoPx }}\" height=\"{{ r.photoPx }}\" alt=\"\"><\u002Fsc-if><sc-if value=\"{{ r.photoLettersShown }}\" hint-placeholder-val=\"{{ true }}\"><span class=\"{{ r.photoClass }}\" aria-hidden=\"true\">{{ r.photoLetters }}<\u002Fspan><\u002Fsc-if>\n              <span style=\"flex:1 1 160px;min-width:0\">\n                <span style=\"display:block;font-size:14px;font-weight:700\">{{ r.name }}<\u002Fspan>\n                <span style=\"display:block;font-family:var(--font-mono);font-size:11px;color:var(--gray-30)\">{{ r.sub }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;border:1px solid var(--gray-15)\">\n                <button data-id=\"{{ r.id }}\" data-level=\"view\" sc-camel-on-click=\"{{ shareSetLevel }}\" aria-pressed=\"{{ r.isViewStr }}\" style=\"{{ r.viewStyle }}\">Can view<\u002Fbutton>\n                <button data-id=\"{{ r.id }}\" data-level=\"comment\" sc-camel-on-click=\"{{ shareSetLevel }}\" aria-pressed=\"{{ r.isCommentStr }}\" style=\"{{ r.commentStyle }}\">Can comment<\u002Fbutton>\n                <button data-id=\"{{ r.id }}\" data-level=\"edit\" sc-camel-on-click=\"{{ shareSetLevel }}\" aria-pressed=\"{{ r.isEditStr }}\" style=\"{{ r.editStyle }}\">Can edit<\u002Fbutton>\n              <\u002Fspan>\n              <button data-id=\"{{ r.id }}\" sc-camel-on-click=\"{{ shareRemove }}\" title=\"Remove access\" aria-label=\"{{ r.removeLabel }}\" style=\"width:30px;height:30px;flex:0 0 30px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-40);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\" style-hover=\"color:var(--red-500);border-color:var(--red-500)\">\n                <svg width=\"14\" height=\"14\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ shareNobody }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:13px;color:var(--gray-30);padding-top:10px\">Not shared with anyone yet. Search above to add someone.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-family:var(--font-mono);font-size:10px;letter-spacing:0.09em;text-transform:uppercase;color:var(--gray-30);margin-bottom:6px\">General access<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <sc-for list=\"{{ shareGeneral }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <button data-v=\"{{ g.key }}\" sc-camel-on-click=\"{{ shareSetVisibility }}\" aria-pressed=\"{{ g.pressed }}\" style=\"{{ g.style }}\">\n                <span style=\"display:block;font-size:14px;font-weight:700\">{{ g.label }}<\u002Fspan>\n                <span style=\"display:block;font-size:12px;color:var(--gray-40);margin-top:2px\">{{ g.hint }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n            <!-- What the whole team may do, like a person's level above. -->\n            <sc-if value=\"{{ shareTeamOn }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:2px 0 0 12px\">\n                <span style=\"font-size:13px;color:var(--gray-50)\">The team<\u002Fspan>\n                <span role=\"group\" aria-label=\"What everyone on the team can do\" style=\"display:flex;border:1px solid var(--gray-15)\">\n                  <button data-level=\"view\" sc-camel-on-click=\"{{ shareSetTeamLevel }}\" aria-pressed=\"{{ teamViewStr }}\" style=\"{{ teamViewStyle }}\">Can view<\u002Fbutton>\n                  <button data-level=\"comment\" sc-camel-on-click=\"{{ shareSetTeamLevel }}\" aria-pressed=\"{{ teamCommentStr }}\" style=\"{{ teamCommentStyle }}\">Can comment<\u002Fbutton>\n                  <button data-level=\"edit\" sc-camel-on-click=\"{{ shareSetTeamLevel }}\" aria-pressed=\"{{ teamEditStr }}\" style=\"{{ teamEditStyle }}\">Can edit<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasShareError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid var(--red-500);color:var(--red-500);padding:10px 12px;font-size:13px\">{{ shareError }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n        <sc-if value=\"{{ shareReady }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ copyShareLink }}\" style=\"display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-50);font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em\" style-hover=\"border-color:var(--black);color:var(--black)\">\n            <svg width=\"16\" height=\"16\"><use href=\"#ui-link\"><\u002Fuse><\u002Fsvg>Copy link\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <span style=\"flex:1;min-width:120px;font-size:12px;color:var(--gray-40)\">{{ shareStatus }}<\u002Fspan>\n        <button sc-camel-on-click=\"{{ closeShare }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">Done<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- Comments: beside the board, like a document's. -->\n<sc-if value=\"{{ commentsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <aside class=\"sl-comments\" data-noprint=\"\" aria-label=\"Comments\" style=\"position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;z-index:55;background:var(--gray-5);border-left:1px solid var(--gray-15);box-shadow:var(--shadow-2);display:flex;flex-direction:column;color:var(--black)\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--gray-15);background:var(--white)\">\n      <div>\n        <div style=\"font-family:var(--font-display);font-weight:900;font-size:20px;letter-spacing:-0.01em;text-transform:uppercase;line-height:1\">Comments<\u002Fdiv>\n        <div style=\"font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:var(--gray-30);margin-top:4px\">{{ commentsHeading }}<\u002Fdiv>\n px;width:100%;min-height:64px;resize:vertical\"><\u002Ftextarea>\n          <sc-if value=\"{{ hasCommentGif }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:relative;align-self:flex-start\">\n              <img class=\"sl-draft-gif\" src=\"{{ commentGifUrl }}\" alt=\"Chosen GIF\" style=\"display:block;max-width:160px;max-height:140px\">\n              <button data-target=\"new\" sc-camel-on-click=\"{{ removeGif }}\" title=\"Remove GIF\" aria-label=\"Remove GIF\" style=\"position:absolute;top:4px;right:4px;width:24px;height:24px;background:rgba(0,0,0,0.6);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0\">\n                <svg width=\"12\" height=\"12\"><use href=\"#ui-close\"><\u002Fuse><\u002Fsvg>\n              <\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;justify-content:flex-end;gap:8px\">\n            <sc-if value=\"{{ gifsEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n              <button class=\"sl-gif-btn\" data-target=\"new\" sc-camel-on-click=\"{{ openGifPicker }}\" title=\"Add a GIF\" style=\"height:36px;padding:0 10px;background:transparent;border:1px solid var(--gray-15);color:var(--gray-50);font-family:var(--font-mono);font-size:12px;font-weight:700;cursor:pointer;letter-spacing:0.04em\" style-hover=\"border-color:var(--black);color:var(--black)\">GIF<\u002Fbutton>\n            <\u002Fsc-if>\n            <button class=\"sl-comment-send\" sc-camel-on-click=\"{{ addComment }}\" style=\"{{ addBtnStyle }}\" style-hover=\"opacity:0.88\">{{ commentSendLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ cannotComment }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px;color:var(--gray-40)\">You can read the comments on this storyboard, but not add to them.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasCommentsErr
